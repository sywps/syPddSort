function estimateImportedBoardSize(img) {
    if (img.width <= IMPORT_MAX_SIDE && img.height <= IMPORT_MAX_SIDE) {
        return {
            boardWidth: Math.max(1, img.width),
            boardHeight: Math.max(1, img.height),
        };
    }

    const aspect = img.width / img.height;
    let boardWidth;
    let boardHeight;
    if (aspect >= 1) {
        boardWidth = IMPORT_MAX_SIDE;
        boardHeight = Math.max(4, Math.round(IMPORT_MAX_SIDE / aspect));
    } else {
        boardHeight = IMPORT_MAX_SIDE;
        boardWidth = Math.max(4, Math.round(IMPORT_MAX_SIDE * aspect));
    }
    boardWidth = Math.min(IMPORT_MAX_SIDE, boardWidth);
    boardHeight = Math.min(IMPORT_MAX_SIDE, boardHeight);
    return { boardWidth, boardHeight };
}

function buildDominantBorderColor(data, width, height) {
    const bins = new Map();
    let totalWeight = 0;

    function addPixel(x, y, weight = 1) {
        const idx = (y * width + x) * 4;
        const alpha = data[idx + 3];
        if (alpha < IMPORT_MIN_FOREGROUND_ALPHA) return;
        const r = data[idx];
        const g = data[idx + 1];
        const b = data[idx + 2];
        const key = `${Math.round(r / 24)}_${Math.round(g / 24)}_${Math.round(b / 24)}`;
        const entry = bins.get(key) || { weight: 0, r: 0, g: 0, b: 0 };
        entry.weight += weight;
        entry.r += r * weight;
        entry.g += g * weight;
        entry.b += b * weight;
        bins.set(key, entry);
        totalWeight += weight;
    }

    for (let x = 0; x < width; x++) {
        addPixel(x, 0, 1);
        addPixel(x, height - 1, 1);
    }
    for (let y = 1; y < height - 1; y++) {
        addPixel(0, y, 1);
        addPixel(width - 1, y, 1);
    }

    addPixel(0, 0, 4);
    addPixel(width - 1, 0, 4);
    addPixel(0, height - 1, 4);
    addPixel(width - 1, height - 1, 4);

    let best = null;
    for (const entry of bins.values()) {
        if (!best || entry.weight > best.weight) {
            best = entry;
        }
    }
    if (!best || totalWeight <= 0) return null;
    if (best.weight / totalWeight < 0.16 && best.weight < 12) return null;

    return {
        r: best.r / best.weight,
        g: best.g / best.weight,
        b: best.b / best.weight,
    };
}

function isBackgroundLike(r, g, b, alpha, backgroundRgb) {
    if (alpha < IMPORT_MIN_FOREGROUND_ALPHA) return true;
    if (!backgroundRgb) return false;
    const rgb = { r, g, b };
    const dist = weightedRgbDistance(rgb, backgroundRgb);
    const lumDiff = Math.abs(luminance(rgb) - luminance(backgroundRgb));
    return dist <= 7800 || (dist <= 15000 && lumDiff <= 20);
}

function buildBackgroundMask(data, width, height) {
    const backgroundRgb = buildDominantBorderColor(data, width, height);
    const mask = new Uint8Array(width * height);
    const queue = [];

    function tryPush(x, y) {
        const index = y * width + x;
        if (mask[index]) return;
        const offset = index * 4;
        if (!isBackgroundLike(
            data[offset],
            data[offset + 1],
            data[offset + 2],
            data[offset + 3],
            backgroundRgb
        )) {
            return;
        }
        mask[index] = 1;
        queue.push(index);
    }

    for (let x = 0; x < width; x++) {
        tryPush(x, 0);
        tryPush(x, height - 1);
    }
    for (let y = 1; y < height - 1; y++) {
        tryPush(0, y);
        tryPush(width - 1, y);
    }

    for (let head = 0; head < queue.length; head++) {
        const index = queue[head];
        const x = index % width;
        const y = Math.floor(index / width);
        if (x > 0) tryPush(x - 1, y);
        if (x + 1 < width) tryPush(x + 1, y);
        if (y > 0) tryPush(x, y - 1);
        if (y + 1 < height) tryPush(x, y + 1);
    }

    return { mask, backgroundRgb };
}

function buildForegroundSamples(data, width, height, boardWidth, boardHeight, backgroundMask, backgroundRgb) {
    const samples = Array.from({ length: boardHeight }, () => Array(boardWidth).fill(null));
    for (let row = 0; row < boardHeight; row++) {
        const y0 = Math.floor(row * height / boardHeight);
        const y1 = Math.max(y0 + 1, Math.floor((row + 1) * height / boardHeight));
        for (let col = 0; col < boardWidth; col++) {
            const x0 = Math.floor(col * width / boardWidth);
            const x1 = Math.max(x0 + 1, Math.floor((col + 1) * width / boardWidth));
            let sumR = 0;
            let sumG = 0;
            let sumB = 0;
            let foregroundCount = 0;
            let totalCount = 0;

            for (let y = y0; y < y1; y++) {
                for (let x = x0; x < x1; x++) {
                    totalCount++;
                    const pixelIndex = y * width + x;
                    if (backgroundMask[pixelIndex]) continue;
                    const offset = pixelIndex * 4;
                    const alpha = data[offset + 3];
                    if (alpha < IMPORT_MIN_FOREGROUND_ALPHA) continue;
                    sumR += data[offset];
                    sumG += data[offset + 1];
                    sumB += data[offset + 2];
                    foregroundCount++;
                }
            }

            if (!foregroundCount) continue;

            const coverage = foregroundCount / Math.max(1, totalCount);
            const avg = {
                r: sumR / foregroundCount,
                g: sumG / foregroundCount,
                b: sumB / foregroundCount,
                coverage,
            };

            if (
                coverage < IMPORT_EMPTY_CELL_COVERAGE &&
                backgroundRgb &&
                weightedRgbDistance(avg, backgroundRgb) < 9000
            ) {
                continue;
            }
            samples[row][col] = avg;
        }
    }
    return samples;
}

function diffuseQuantizationErrors(samples) {
    const height = samples.length;
    const width = samples[0].length;
    const work = samples.map(row => row.map(cell => (cell ? { ...cell } : null)));
    const grid = Array.from({ length: height }, () => Array(width).fill(0));

    function addError(row, col, factor, errR, errG, errB) {
        if (row < 0 || row >= height || col < 0 || col >= width) return;
        const cell = work[row][col];
        if (!cell) return;
        cell.r = clampNumber(cell.r + errR * factor, 0, 255);
        cell.g = clampNumber(cell.g + errG * factor, 0, 255);
        cell.b = clampNumber(cell.b + errB * factor, 0, 255);
    }

    for (let row = 0; row < height; row++) {
        const leftToRight = row % 2 === 0;
        for (let offset = 0; offset < width; offset++) {
            const col = leftToRight ? offset : (width - 1 - offset);
            const cell = work[row][col];
            if (!cell) continue;

            const colorId = findClosestColor(cell.r, cell.g, cell.b);
            grid[row][col] = colorId;

            const paletteRgb = COLOR_RGB[colorId];
            const errR = cell.r - paletteRgb.r;
            const errG = cell.g - paletteRgb.g;
            const errB = cell.b - paletteRgb.b;

            if (leftToRight) {
                addError(row, col + 1, 7 / 16, errR, errG, errB);
                addError(row + 1, col - 1, 3 / 16, errR, errG, errB);
                addError(row + 1, col, 5 / 16, errR, errG, errB);
                addError(row + 1, col + 1, 1 / 16, errR, errG, errB);
            } else {
                addError(row, col - 1, 7 / 16, errR, errG, errB);
                addError(row + 1, col + 1, 3 / 16, errR, errG, errB);
                addError(row + 1, col, 5 / 16, errR, errG, errB);
                addError(row + 1, col - 1, 1 / 16, errR, errG, errB);
            }
        }
    }

    return grid;
}

function trimGridWithPadding(grid, padding = 1) {
    const height = grid.length;
    const width = grid[0].length;
    let minRow = height;
    let maxRow = -1;
    let minCol = width;
    let maxCol = -1;

    for (let row = 0; row < height; row++) {
        for (let col = 0; col < width; col++) {
            if (grid[row][col] <= 0) continue;
            minRow = Math.min(minRow, row);
            maxRow = Math.max(maxRow, row);
            minCol = Math.min(minCol, col);
            maxCol = Math.max(maxCol, col);
        }
    }

    if (maxRow < 0 || maxCol < 0) {
        throw new Error('图片为空，未提取到有效图案');
    }

    const trimmed = [];
    for (let row = minRow; row <= maxRow; row++) {
        trimmed.push(grid[row].slice(minCol, maxCol + 1));
    }

    const trimmedWidth = trimmed[0].length;
    const trimmedHeight = trimmed.length;
    if (
        padding <= 0 ||
        trimmedWidth + padding * 2 > IMPORT_MAX_SIDE ||
        trimmedHeight + padding * 2 > IMPORT_MAX_SIDE
    ) {
        return trimmed;
    }

    const padded = Array.from(
        { length: trimmedHeight + padding * 2 },
        () => Array(trimmedWidth + padding * 2).fill(0)
    );
    for (let row = 0; row < trimmedHeight; row++) {
        for (let col = 0; col < trimmedWidth; col++) {
            padded[row + padding][col + padding] = trimmed[row][col];
        }
    }
    return padded;
}

function countFilledCells(grid) {
    let total = 0;
    for (const row of grid) {
        for (const value of row) {
            if (value > 0) total++;
        }
    }
    return total;
}

function buildImportedGrid(img) {
    const { boardWidth, boardHeight } = estimateImportedBoardSize(img);
    const workWidth = Math.max(boardWidth * IMPORT_SAMPLE_SCALE, 96);
    const workHeight = Math.max(boardHeight * IMPORT_SAMPLE_SCALE, 96);

    const canvas = document.createElement('canvas');
    canvas.width = workWidth;
    canvas.height = workHeight;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.clearRect(0, 0, workWidth, workHeight);
    ctx.drawImage(img, 0, 0, workWidth, workHeight);

    const { data } = ctx.getImageData(0, 0, workWidth, workHeight);
    const { mask, backgroundRgb } = buildBackgroundMask(data, workWidth, workHeight);
    const samples = buildForegroundSamples(
        data,
        workWidth,
        workHeight,
        boardWidth,
        boardHeight,
        mask,
        backgroundRgb
    );
    let correctColorArr = diffuseQuantizationErrors(samples);
    correctColorArr = trimGridWithPadding(correctColorArr, 1);
    const filledCellCount = countFilledCells(correctColorArr);

    if (filledCellCount === 0) {
        throw new Error('图片为空，或透明区域过多，未生成有效豆豆');
    }

    return {
        boardWidth: correctColorArr[0].length,
        boardHeight: correctColorArr.length,
        filledCellCount,
        correctColorArr,
    };
}

function buildImportedLevelPayload(fileName, img) {
    const nextLevelId = getDefaultAppendLevelId();
    const { boardWidth, boardHeight, correctColorArr } = buildImportedGrid(img);
    return {
        levelId: nextLevelId,
        boardWidth,
        boardHeight,
        timeLimit: Math.max(120, boardWidth * boardHeight * 2),
        correctColorArr,
        online: false,
        isFeatured: false,
        levelCategory: 'image_import',
        levelName: stripExtension(fileName || 'image_import'),
        style: 'reference_image',
        sourceImageName: fileName || '',
    };
}

function loadImageFromFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('读取图片失败'));
        reader.onload = event => {
            const img = new Image();
            img.onerror = () => reject(new Error('图片格式无效，无法解析'));
            img.onload = () => resolve(img);
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });
}

function upsertLevel(levelData) {
    const existingIndex = levels.findIndex(item => item.levelId === levelData.levelId);
    if (existingIndex >= 0) {
        levels[existingIndex] = levelData;
    } else {
        levels.push(levelData);
    }
    levels.sort((a, b) => a.levelId - b.levelId);

    if (!levelIds.includes(levelData.levelId)) {
        levelIds.push(levelData.levelId);
        levelIds.sort((a, b) => a - b);
    }
}

async function importImageLevel(file) {
    if (!file || isImportingImage) return;
    isImportingImage = true;
    const btn = document.getElementById('imageImportBtn');
    btn.disabled = true;
    btn.textContent = '生成中...';
    if (importStatusTimer) {
        clearTimeout(importStatusTimer);
        importStatusTimer = null;
    }

    try {
        setImportStatus(`正在导入 ${file.name} ...`);
        const img = await loadImageFromFile(file);
        const levelData = buildImportedLevelPayload(file.name, img);
        const resp = await fetch('/api/import-level', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ levelData, dir: LEVEL_DIR, targetDir: LEVEL_DIR }),
        });
        const result = await resp.json();
        if (!resp.ok || !result.ok) {
            throw new Error(result.error || `HTTP ${resp.status}`);
        }

        upsertLevel(result.levelData);
        renderAll();
        showDetail(result.levelData);
        requestAnimationFrame(() => {
            const card = document.querySelector(`.card[data-level="${result.levelId}"]`);
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
        setImportStatus(`已生成到 ${getLevelDirDisplayName()} / 第 ${result.levelId} 关`, 'success', LEVEL_DIR_LABEL);
        importStatusTimer = setTimeout(() => {
            refreshImportStatus();
            importStatusTimer = null;
        }, 2500);
    } catch (error) {
        setImportStatus(`导入失败: ${error.message}`, 'error');
        importStatusTimer = setTimeout(() => {
            refreshImportStatus();
            importStatusTimer = null;
        }, 4000);
    } finally {
        isImportingImage = false;
        btn.disabled = false;
        btn.textContent = '上传图片生成关卡';
        const input = document.getElementById('imageImportInput');
        input.value = '';
    }
}

function firstNonEmptyArray(...values) {
    for (const value of values) {
        if (Array.isArray(value) && value.length > 0) return value;
    }
    return [];
}

function normalizeRegionMap(rawRegionMap) {
    if (!Array.isArray(rawRegionMap) || rawRegionMap.length === 0) return [];
    const flattened = Array.isArray(rawRegionMap[0]) ? rawRegionMap.flat() : rawRegionMap;
    return flattened.map(value => Number(value));
}

function normalizeTimeRegs(rawTimeRegs) {
    if (!Array.isArray(rawTimeRegs) || rawTimeRegs.length === 0) return [];
    return rawTimeRegs
        .map(reg => ({
            rowIndex: Math.floor(Number(reg?.rowIndex ?? reg?.row ?? reg?.r)),
            colIndex: Math.floor(Number(reg?.colIndex ?? reg?.col ?? reg?.c)),
            width: Math.floor(Number(reg?.width ?? reg?.w)),
            height: Math.floor(Number(reg?.height ?? reg?.h)),
            time: Math.floor(Number(reg?.time ?? reg?.timeLimit ?? 0)),
        }))
        .filter(reg => Number.isFinite(reg.rowIndex)
            && Number.isFinite(reg.colIndex)
            && Number.isFinite(reg.width)
            && Number.isFinite(reg.height)
            && reg.width > 0
            && reg.height > 0);
}

function getSpecialMeta(data) {
    const sourceFields = data?.sourceFields || {};
    const regionMap = normalizeRegionMap(firstNonEmptyArray(data?.regionMap, sourceFields.regionMap));
    const timeRegs = normalizeTimeRegs(firstNonEmptyArray(data?.timeRegs, sourceFields.timeRegs));
    const hasRegionMap = regionMap.some(value => Number.isFinite(value) && value >= 0);
    const hasTimeRegs = timeRegs.length > 0;
    const specialMode = hasTimeRegs ? 'timeRegs' : (hasRegionMap ? 'regionMap' : null);
    return {
        regionMap,
        timeRegs,
        hasRegionMap,
        hasTimeRegs,
        hasSpecial: Boolean(specialMode),
        hasMultipleSpecialModes: hasRegionMap && hasTimeRegs,
        specialMode,
    };
}

function createSpecialBadges(meta) {
    if (!meta?.hasSpecial) return null;
    const wrap = document.createElement('div');
    wrap.className = 'special-badges';
    const badge = document.createElement('div');
    badge.className = 'special-badge';
    badge.title = meta.specialMode === 'timeRegs' ? '小框倒计时' : '分区/分层';
    badge.innerHTML = meta.specialMode === 'timeRegs'
        ? '<span class="special-clock-icon"></span>'
        : '<span class="special-region-icon"></span>';
    wrap.appendChild(badge);
    return wrap;
}

function drawRegionMapOverlay(ctx, regionMap, boardWidth, boardHeight, cellSize, mode) {
    if (!Array.isArray(regionMap) || regionMap.length < boardWidth * boardHeight) return;
    const isValidRegion = value => Number.isFinite(value) && value >= 0;
    const regionAt = (row, col) => regionMap[row * boardWidth + col];
    ctx.save();
    ctx.strokeStyle = 'rgba(54,148,213,.92)';
    ctx.lineWidth = mode === 'detail' ? Math.max(1.5, cellSize * 0.16) : Math.max(1, cellSize * 0.18);
    ctx.lineCap = 'square';
    ctx.beginPath();
    for (let r = 0; r < boardHeight; r++) {
        for (let c = 0; c < boardWidth; c++) {
            const current = regionAt(r, c);
            if (!isValidRegion(current)) continue;
            const x = c * cellSize;
            const y = r * cellSize;
            const addEdge = (r2, c2, x1, y1, x2, y2) => {
                const neighbor = r2 < 0 || r2 >= boardHeight || c2 < 0 || c2 >= boardWidth ? NaN : regionAt(r2, c2);
                if (!isValidRegion(neighbor) || neighbor !== current) {
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                }
            };
            addEdge(r - 1, c, x, y, x + cellSize, y);
            addEdge(r + 1, c, x, y + cellSize, x + cellSize, y + cellSize);
            addEdge(r, c - 1, x, y, x, y + cellSize);
            addEdge(r, c + 1, x + cellSize, y, x + cellSize, y + cellSize);
        }
    }
    ctx.stroke();
    ctx.restore();
}

function drawTimeRegsOverlay(ctx, timeRegs, boardWidth, boardHeight, cellSize, mode) {
    if (!Array.isArray(timeRegs) || timeRegs.length === 0) return;
    ctx.save();
    for (const reg of timeRegs) {
        const row = Math.max(0, Math.min(boardHeight - 1, reg.rowIndex));
        const col = Math.max(0, Math.min(boardWidth - 1, reg.colIndex));
        const width = Math.max(1, Math.min(boardWidth - col, reg.width));
        const height = Math.max(1, Math.min(boardHeight - row, reg.height));
        const x = col * cellSize;
        const y = row * cellSize;
        const w = width * cellSize;
        const h = height * cellSize;
        const line = mode === 'detail' ? Math.max(2, cellSize * 0.22) : Math.max(1.5, cellSize * 0.2);
        ctx.fillStyle = 'rgba(166,225,255,.18)';
        ctx.strokeStyle = 'rgba(74,157,212,.96)';
        ctx.lineWidth = line;
        ctx.beginPath();
        ctx.roundRect(x + line / 2, y + line / 2, Math.max(1, w - line), Math.max(1, h - line), Math.max(2, cellSize * 0.25));
        ctx.fill();
        ctx.stroke();
    }
    ctx.restore();
}

function drawSpecialOverlays(ctx, specialMeta, boardWidth, boardHeight, cellSize, mode = 'card') {
    if (!specialMeta) return;
    if (specialMeta.specialMode === 'regionMap') {
        drawRegionMapOverlay(ctx, specialMeta.regionMap, boardWidth, boardHeight, cellSize, mode);
    }
    if (specialMeta.specialMode === 'timeRegs') {
        drawTimeRegsOverlay(ctx, specialMeta.timeRegs, boardWidth, boardHeight, cellSize, mode);
    }
}

function drawGrid(canvas, grid, cellSize, options = {}) {
    const h = grid.length, w = grid[0].length;
    canvas.width = w * cellSize;
    canvas.height = h * cellSize;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingEnabled = false;

    for (let r = 0; r < h; r++) {
        for (let c = 0; c < w; c++) {
            const v = grid[r][c];
            if (v === 0) continue;
            const hex = COLOR_HEX[v] || '#ccc';
            const x = c * cellSize, y = r * cellSize;
            const radius = Math.max(0.5, cellSize * 0.14);

            // Fill the full cell so preview scaling does not create white seams.
            ctx.beginPath();
            ctx.roundRect(x, y, cellSize + 0.35, cellSize + 0.35, radius);
            ctx.fillStyle = hex;
            ctx.fill();

            // Subtle highlight
            if (cellSize >= 7) {
                ctx.beginPath();
                ctx.roundRect(x + cellSize * 0.18, y + cellSize * 0.16, cellSize * 0.64, cellSize * 0.24, radius);
                ctx.fillStyle = 'rgba(255,255,255,0.10)';
                ctx.fill();
            }
        }
    }

    if (options.specialMeta) {
        drawSpecialOverlays(ctx, options.specialMeta, w, h, cellSize, options.specialMode || 'card');
    }
}

function getColorInfo(grid) {
    const counts = {};
    for (const row of grid)
        for (const v of row)
            if (v > 0) counts[v] = (counts[v] || 0) + 1;
    return counts;
}

function getDisplacementRate(correct, init) {
    let displaced = 0, total = 0;
    for (let r = 0; r < correct.length; r++)
        for (let c = 0; c < correct[r].length; c++)
            if (correct[r][c] !== 0) {
                total++;
                if (init[r][c] !== correct[r][c]) displaced++;
            }
    return total > 0 ? (displaced / total * 100).toFixed(1) : '0';
}

function getOfficialImportForLevel(levelId) {
    const id = Number(levelId);
    const data = levels.find(item => Number(item.levelId) === id);
    if (data?.officialImport) return data.officialImport;
    const entry = levelEntryMap.get(id);
    return entry?.officialImport || null;
}

function normalizeImportMarker(marker) {
    if (!marker || typeof marker !== 'object') return null;
    if (marker.targets && typeof marker.targets === 'object') return marker;
    if (marker.targetType || marker.targetLevelId) {
        const targetType = marker.targetType === 'theme' ? 'theme' : 'online';
        return {
            sourcePath: marker.sourcePath,
            targets: { [targetType]: marker },
        };
    }
    return null;
}

function getImportTargetsForLevel(levelId) {
    const marker = normalizeImportMarker(getOfficialImportForLevel(levelId));
    return marker?.targets || {};
}

function isImportedLevel(data) {
    return Object.keys(getImportTargetsForLevel(data.levelId)).length > 0;
}

function getImportTargetLabel(type) {
    return type === 'theme' ? '主题' : '正式';
}

function getImportBadgeText(levelId) {
    const targets = getImportTargetsForLevel(levelId);
    return Object.entries(targets)
        .filter(([, target]) => target && target.targetLevelId)
        .map(([type, target]) => `${getImportTargetLabel(type)} #${target.targetLevelId}`)
        .join(' / ');
}

function getImportBadgeTitle(levelId) {
    const targets = getImportTargetsForLevel(levelId);
    return Object.entries(targets)
        .filter(([, target]) => target && target.targetPath)
        .map(([type, target]) => `${getImportTargetLabel(type)}: ${target.targetPath}`)
        .join('\n');
}

function renderCard(data) {
    const isFeatured = data.isFeatured || false;
    const isOnline = data.online === true;
    const hasOfficialImport = isImportedLevel(data);
    const importBadgeText = getImportBadgeText(data.levelId);
    const importBadgeTitle = getImportBadgeTitle(data.levelId);
    const onlineActionText = isOnline ? '🟢 上线' : '⚪ 上线';
    const onlineActionTitle = isOnline ? '取消上线' : '标记上线';
    const card = document.createElement('div');
    card.className = 'card'
        + (isFeatured ? ' featured' : '')
        + (SHOW_ONLINE_ACTION && isOnline ? ' online' : '')
        + (hasOfficialImport ? ' imported' : '');
    card.dataset.level = data.levelId;
    card.dataset.colors = Object.keys(getColorInfo(data.correctColorArr)).length;
    card.dataset.featured = isFeatured ? '1' : '0';
    card.dataset.online = isOnline ? '1' : '0';
    card.dataset.imported = hasOfficialImport ? '1' : '0';

    if (batchSelectMode) {
        card.classList.add('batch-mode');
        if (selectedLevelIds.has(Number(data.levelId))) {
            card.classList.add('selected');
        }
        const check = document.createElement('div');
        check.className = 'select-check';
        check.textContent = selectedLevelIds.has(Number(data.levelId)) ? '✓' : '';
        check.title = '选择关卡';
        check.onclick = event => {
            event.stopPropagation();
            toggleLevelSelection(data.levelId);
        };
        card.appendChild(check);
    }

    if (SHOW_ONLINE_ACTION && isOnline) {
        const badge = document.createElement('div');
        badge.className = 'badge-online';
        badge.textContent = '🟢 上线';
        card.appendChild(badge);
    }

    if (hasOfficialImport) {
        const badge = document.createElement('div');
        badge.className = 'badge-imported';
        badge.textContent = importBadgeText || '已导入';
        badge.title = importBadgeTitle || '';
        card.appendChild(badge);
    }

    if (isFeatured) {
        const badge = document.createElement('div');
        badge.className = 'badge-featured';
        badge.textContent = '⭐ 精选';
        card.appendChild(badge);
    }

    const maxDim = Math.max(data.boardWidth, data.boardHeight);
    const cellSize = Math.max(3, Math.min(8, Math.floor(180 / maxDim)));
    const colors = getColorInfo(data.correctColorArr);
    const colorCount = Object.keys(colors).length;
    const beanCount = Object.values(colors).reduce((a, b) => a + b, 0);
    const dispRate = getDisplacementRate(data.correctColorArr, data.initRandomColorArr);
    const specialMeta = getSpecialMeta(data);

    // Preview: show target only
    const previewDiv = document.createElement('div');
    previewDiv.className = 'preview';

    const targetCol = document.createElement('div');
    targetCol.className = 'col';
    const targetLabel = document.createElement('div');
    targetLabel.className = 'label';
    targetLabel.textContent = '目标';
    targetCol.appendChild(targetLabel);
    const canvasTarget = document.createElement('canvas');
    targetCol.appendChild(canvasTarget);
    previewDiv.appendChild(targetCol);
    const specialBadges = createSpecialBadges(specialMeta);
    if (specialBadges) card.appendChild(specialBadges);

    card.appendChild(previewDiv);

    drawGrid(canvasTarget, data.correctColorArr, cellSize);

    // Info
    const info = document.createElement('div');
    info.className = 'info';
    const colorHexMap = Object.keys(colors).every(c => PNG_HEX[c]) ? PNG_HEX : COLOR_HEX;
    const colorDots = Object.keys(colors).map(c =>
        `<span class="color-dot" style="background:${colorHexMap[c]}" title="${COLOR_NAMES[c]}"></span>`
    ).join('');
    const statusHtml = CAN_IMPORT_TO_OFFICIAL
        ? `<span class="online-status">${hasOfficialImport ? `已导入 ${importBadgeText}` : '未导入'}</span>`
        : (SHOW_ONLINE_ACTION ? `<span class="online-status">${isOnline ? '🟢 已上线' : '⚪ 未上线'}</span>` : '');
    info.innerHTML = `
        <div class="title">第 ${data.levelId} 关</div>
        <div class="meta">
            <span>📐 ${data.boardWidth}×${data.boardHeight}</span>
            <span>🎨 ${colorCount}色</span>
            <span>🔢 ${beanCount}豆</span><br>
            <span>⏱ ${data.timeLimit}s</span>
            <span>🔀 ${dispRate}%</span>
            ${statusHtml}
            <span>${colorDots}</span>
        </div>
    `;
    card.appendChild(info);

    // Actions
    const actions = document.createElement('div');
    actions.className = 'actions';
    const importButtonHtml = CAN_IMPORT_TO_OFFICIAL ? `
        <button class="btn-copy" data-level="${data.levelId}" onclick="event.stopPropagation(); openCopyModal(${data.levelId})" title="导入到正式关卡 / 主题挑战">📋 导入</button>
    ` : '';
    const swapButtonHtml = CAN_SWAP_LEVELS ? `
        <button class="btn-swap-card" data-level="${data.levelId}" onclick="event.stopPropagation(); openSwapModal(${data.levelId})" title="交换关卡">↔ 交换</button>
    ` : '';
    const onlineButtonHtml = SHOW_ONLINE_ACTION ? `
        <button class="btn-online${isOnline ? ' active' : ''}" data-level="${data.levelId}" onclick="event.stopPropagation(); handleOnlineAction(${data.levelId}, this)" title="${onlineActionTitle}">${onlineActionText}</button>
    ` : '';
    actions.innerHTML = `
        <a class="btn-play" href="${buildPlayUrl(data)}" target="_blank" onclick="event.stopPropagation()">▶ 玩</a>
        <a class="btn-edit" href="${buildRefineUrl(data)}" target="_blank" onclick="event.stopPropagation()">✏️ 微调</a>
        ${importButtonHtml}
        ${swapButtonHtml}
        ${onlineButtonHtml}
        <button class="btn-featured${isFeatured ? ' active' : ''}" data-level="${data.levelId}" onclick="event.stopPropagation(); toggleFeatured(${data.levelId}, this)" title="加入精选">${isFeatured ? '⭐ 精选' : '☆ 精选'}</button>
    `;
    card.appendChild(actions);

    card.addEventListener('click', () => {
        if (batchSelectMode) {
            toggleLevelSelection(data.levelId);
            return;
        }
        showDetail(data);
    });
    return card;
}

function showDetail(data) {
    const modal = document.getElementById('modal');
    const colors = getColorInfo(data.correctColorArr);
    const colorCount = Object.keys(colors).length;
    const beanCount = Object.values(colors).reduce((a, b) => a + b, 0);
    const dispRate = getDisplacementRate(data.correctColorArr, data.initRandomColorArr);
    const maxDim = Math.max(data.boardWidth, data.boardHeight);
    const cellSize = Math.max(3, Math.min(10, Math.floor(320 / maxDim)));
    const specialMeta = getSpecialMeta(data);

    const colorHexMap = Object.keys(colors).every(c => PNG_HEX[c]) ? PNG_HEX : COLOR_HEX;
    const colorDetails = Object.entries(colors)
        .sort((a, b) => b[1] - a[1])
        .map(([c, n]) => `<span class="color-dot" style="background:${colorHexMap[c]}"></span>${COLOR_NAMES[c]}: ${n}`)
        .join('&nbsp;&nbsp;');

    modal.innerHTML = `
        <button class="close-btn" onclick="closeModal()">✕</button>
        <h2>第 ${data.levelId} 关</h2>
        <div class="compare">
            <div class="col">
                <h3>🎯 目标图案</h3>
                <canvas id="detailTarget"></canvas>
            </div>
            <div class="col">
                <h3>🔀 初始乱序</h3>
                <canvas id="detailShuffle"></canvas>
            </div>
        </div>
        <div class="detail-meta">
            <strong>棋盘:</strong> ${data.boardWidth}×${data.boardHeight} &nbsp;
            <strong>豆豆数:</strong> ${beanCount} &nbsp;
            <strong>颜色数:</strong> ${colorCount} &nbsp;
            <strong>时限:</strong> ${data.timeLimit}s &nbsp;
            <strong>暂存槽:</strong> ${data.slotTotalCount} &nbsp;
            <strong>位移率:</strong> ${dispRate}%<br>
            <strong>文件:</strong> ${getLevelFilePath(data)}<br>
            <strong>颜色分布:</strong> ${colorDetails}
        </div>
        <div class="detail-actions">
            <a class="btn-play" href="${buildPlayUrl(data)}" target="_blank">▶ 开始游戏</a>
            <a class="btn-edit" href="${buildRefineUrl(data)}" target="_blank">✏️ 微调本关</a>
            <a class="btn-shuffle" href="javascript:void(0)" onclick="event.stopPropagation(); toggleDetailView(this, ${data.levelId})">🔄 切换视图</a>
        </div>
    `;

    drawGrid(document.getElementById('detailTarget'), data.correctColorArr, cellSize, { specialMeta, specialMode: 'detail' });
    drawGrid(document.getElementById('detailShuffle'), data.initRandomColorArr, cellSize, { specialMeta, specialMode: 'detail' });

    document.getElementById('modalOverlay').classList.add('active');
}

function toggleDetailView(btn, levelId) {
    const data = levels.find(l => l.levelId === levelId);
    if (!data) return;
    const targetLabel = document.querySelector('#detailTarget').previousElementSibling;
    const shuffleLabel = document.querySelector('#detailShuffle').parentElement.querySelector('h3');
    const maxDim = Math.max(data.boardWidth, data.boardHeight);
    const cellSize = Math.max(3, Math.min(10, Math.floor(320 / maxDim)));
    const specialMeta = getSpecialMeta(data);
    const isShowingTarget = targetLabel.textContent.includes('目标');
    if (isShowingTarget) {
        drawGrid(document.getElementById('detailTarget'), data.initRandomColorArr, cellSize, { specialMeta, specialMode: 'detail' });
        targetLabel.textContent = '初始';
        drawGrid(document.getElementById('detailShuffle'), data.correctColorArr, cellSize, { specialMeta, specialMode: 'detail' });
        shuffleLabel.textContent = '🎯 目标图案';
    } else {
        drawGrid(document.getElementById('detailTarget'), data.correctColorArr, cellSize, { specialMeta, specialMode: 'detail' });
        targetLabel.textContent = '目标';
        drawGrid(document.getElementById('detailShuffle'), data.initRandomColorArr, cellSize, { specialMeta, specialMode: 'detail' });
        shuffleLabel.textContent = '🔀 初始乱序';
    }
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
}

function getFilteredLevels() {
    const filterColors = parseInt(document.getElementById('filterColors').value);
    const filterCard = document.getElementById('filterCard').value;
    let filtered = levels;
    if (filterCard === 'featured') {
        filtered = filtered.filter(d => d.isFeatured);
    } else if (filterCard === 'imported') {
        filtered = filtered.filter(d => isImportedLevel(d));
    } else if (filterCard === 'notImported') {
        filtered = filtered.filter(d => !isImportedLevel(d));
    }
    if (filterColors > 0) {
        if (filterColors === 6) {
            filtered = filtered.filter(d => Object.keys(getColorInfo(d.correctColorArr)).length >= 6);
        } else {
            filtered = filtered.filter(d => Object.keys(getColorInfo(d.correctColorArr)).length === filterColors);
        }
    }
    return filtered;
}

function renderAll() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const filtered = getFilteredLevels();

    updateStats();

    for (const data of filtered) {
        grid.appendChild(renderCard(data));
    }
}

function syncCardFilterParam() {
    const value = document.getElementById('filterCard').value;
    const url = new URL(window.location);
    url.searchParams.delete('online');
    url.searchParams.delete('featured');
    url.searchParams.delete('cardFilter');
    if (value === 'all') {
        url.searchParams.delete('filter');
    } else {
        url.searchParams.set('filter', value);
    }
    window.history.replaceState({}, '', url.toString());
}

async function onScroll() {
    if (loadedUpTo >= levelIds.length) return;
    const scrollTop = window.scrollY || document.documentElement.scrollTop;
    const clientHeight = document.documentElement.clientHeight;
    const scrollHeight = document.documentElement.scrollHeight;

    if (scrollTop + clientHeight >= scrollHeight - 800) {
        const loaded = await loadMoreLevels();
        if (loaded) renderAll();
    }
}

document.getElementById('filterColors').addEventListener('change', renderAll);
document.getElementById('filterCard').addEventListener('change', () => {
    syncCardFilterParam();
    renderAll();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// Jump to start level
function jumpToStart() {
    const val = parseInt(document.getElementById('startInput').value);
    if (isNaN(val) || val < 0) return;
    const url = new URL(window.location);
    url.searchParams.set('start', val);
    window.location.href = url.toString();
}
document.getElementById('startBtn').addEventListener('click', jumpToStart);
document.getElementById('startInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') jumpToStart();
});
document.getElementById('imageImportBtn').addEventListener('click', () => {
    document.getElementById('imageImportInput').click();
});
document.getElementById('imageImportInput').addEventListener('change', event => {
    const file = event.target.files && event.target.files[0];
    if (file) importImageLevel(file);
});

let scrollTimeout;
window.addEventListener('scroll', () => {
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(onScroll, 150);
});

async function toggleFeatured(levelId, btn) {
    try {
        const resp = await fetch('/api/toggle-featured', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ levelId, dir: LEVEL_DIR, kind: LEVEL_KIND }),
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const result = await resp.json();
        const isFeatured = result.isFeatured;

        // Update the level data
        const level = levels.find(l => l.levelId === levelId);
        if (level) level.isFeatured = isFeatured;

        // Update the button
        btn.className = 'btn-featured' + (isFeatured ? ' active' : '');
        btn.textContent = isFeatured ? '⭐ 精选' : '☆ 精选';
        btn.title = isFeatured ? '取消精选' : '加入精选';

        // Update the card
        const card = btn.closest('.card');
        card.dataset.featured = isFeatured ? '1' : '0';
        card.classList.toggle('featured', isFeatured);

        // Update badge
        let badge = card.querySelector('.badge-featured');
        if (isFeatured && !badge) {
            badge = document.createElement('div');
            badge.className = 'badge-featured';
            badge.textContent = '⭐ 精选';
            card.insertBefore(badge, card.firstChild);
        } else if (!isFeatured && badge) {
            badge.remove();
        }
    } catch (e) {
        alert('精选保存失败: ' + e.message);
    }
}

function handleOnlineAction(levelId, btn) {
    if (CAN_IMPORT_TO_OFFICIAL) {
        openCopyModal(levelId, { mode: 'import' });
        return;
    }
    toggleOnline(levelId, btn);
}

async function toggleOnline(levelId, btn) {
    try {
        const resp = await fetch('/api/toggle-online', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ levelId, dir: LEVEL_DIR, kind: LEVEL_KIND }),
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const result = await resp.json();
        const isOnline = result.online;

        const level = levels.find(l => l.levelId === levelId);
        if (level) level.online = isOnline;

        btn.className = 'btn-online' + (isOnline ? ' active' : '');
        btn.textContent = isOnline ? '🟢 上线' : '⚪ 上线';
        btn.title = isOnline ? '取消上线' : '标记上线';

        const card = btn.closest('.card');
        card.dataset.online = isOnline ? '1' : '0';
        card.classList.toggle('online', isOnline);

        const status = card.querySelector('.online-status');
        if (status) status.textContent = isOnline ? '🟢 已上线' : '⚪ 未上线';

        let badge = card.querySelector('.badge-online');
        if (isOnline && !badge) {
            badge = document.createElement('div');
            badge.className = 'badge-online';
            badge.textContent = '🟢 上线';
            card.insertBefore(badge, card.firstChild);
        } else if (!isOnline && badge) {
            badge.remove();
        }

        if (document.getElementById('filterCard')?.value !== 'all') {
            renderAll();
        }
    } catch (e) {
        alert('上线状态保存失败: ' + e.message);
    }
}

function initBatchControls() {
    const controls = document.getElementById('batchControls');
    if (!controls) return;
    if (!CAN_IMPORT_TO_OFFICIAL) {
        controls.classList.remove('active');
        return;
    }
    controls.classList.add('active');
    document.getElementById('batchSelectBtn').addEventListener('click', () => {
        setBatchSelectMode(!batchSelectMode);
    });
    document.getElementById('batchImportBtn').addEventListener('click', openBatchImportModal);
    const startInput = document.getElementById('batchStartTargetId');
    if (startInput) {
        startInput.addEventListener('input', updateBatchTargetHint);
        startInput.addEventListener('input', resetBatchOverwriteState);
    }
    updateBatchStatus();
}

function setBatchSelectMode(enabled) {
    batchSelectMode = Boolean(enabled);
    if (!batchSelectMode) {
        selectedLevelIds.clear();
    }
    updateBatchStatus();
    renderAll();
}

function toggleLevelSelection(levelId) {
    const id = Number(levelId);
    if (selectedLevelIds.has(id)) {
        selectedLevelIds.delete(id);
    } else {
        selectedLevelIds.add(id);
    }
    updateBatchStatus();
    renderAll();
}

function getSelectedLevelIdsInViewOrder() {
    const selected = new Set(selectedLevelIds);
    return levels
        .map(level => Number(level.levelId))
        .filter(id => selected.has(id));
}

function updateBatchStatus() {
    const selectBtn = document.getElementById('batchSelectBtn');
    const importBtn = document.getElementById('batchImportBtn');
    const status = document.getElementById('batchStatus');
    if (!selectBtn || !importBtn || !status) return;
    const count = selectedLevelIds.size;
    selectBtn.textContent = batchSelectMode ? '退出多选' : '批量选择';
    importBtn.disabled = count <= 0;
    status.textContent = `已选 ${count} 关`;
}

async function openBatchImportModal() {
    if (!selectedLevelIds.size) {
        alert('请先选择要导入的竞品关卡');
        return;
    }
    batchOverwriteAllowed = false;
    batchStartMode = 'append';
    await loadDefaultNextLevelId();
    document.getElementById('batchSourceInfo').textContent = `已选择 ${selectedLevelIds.size} 关`;
    document.getElementById('batchStartTargetId').value = '';
    document.getElementById('batchConfirmBtn').textContent = '确认批量导入';
    showBatchFeedback('');
    setBatchStartMode('append');
    document.getElementById('batchOverlay').classList.add('active');
}

function closeBatchImportModal() {
    document.getElementById('batchOverlay').classList.remove('active');
    document.getElementById('batchStartTargetId').value = '';
    showBatchFeedback('');
    batchOverwriteAllowed = false;
}

function setBatchStartMode(mode) {
    batchStartMode = mode === 'start' ? 'start' : 'append';
    resetBatchOverwriteState();
    document.getElementById('batchAppendBtn').classList.toggle('active', batchStartMode === 'append');
    document.getElementById('batchStartBtn').classList.toggle('active', batchStartMode === 'start');
    document.getElementById('batchStartTargetId').disabled = batchStartMode === 'append';
    updateBatchTargetHint();
}

function resetBatchOverwriteState() {
    batchOverwriteAllowed = false;
    const btn = document.getElementById('batchConfirmBtn');
    if (btn) btn.textContent = '确认批量导入';
}

function updateBatchTargetHint() {
    const count = selectedLevelIds.size;
    const input = document.getElementById('batchStartTargetId');
    const hint = document.getElementById('batchTargetHint');
    if (!hint || !input) return;
    let startId = null;
    if (batchStartMode === 'append') {
        startId = getDefaultAppendLevelId();
        hint.textContent = `将追加到正式关卡末尾：level_${startId}.json 起，共 ${count} 关`;
        return;
    }
    const parsed = parseInt(input.value, 10);
    if (!parsed || parsed < 1) {
        hint.textContent = '请输入有效的起始正式关卡 ID';
        return;
    }
    hint.textContent = `将从 level_${parsed}.json 开始连续导入 ${count} 关`;
}

function showBatchFeedback(msg, type = '') {
    const el = document.getElementById('batchFeedback');
    if (!el) return;
    el.textContent = msg;
    el.className = 'copy-feedback' + (type ? ' ' + type : '');
}

async function executeBatchImport() {
    const ids = getSelectedLevelIdsInViewOrder();
    if (!ids.length) {
        showBatchFeedback('请先选择要导入的关卡', 'error');
        return;
    }
    let startTargetLevelId = null;
    if (batchStartMode === 'start') {
        startTargetLevelId = parseInt(document.getElementById('batchStartTargetId').value, 10);
        if (!startTargetLevelId || startTargetLevelId < 1) {
            showBatchFeedback('请填写有效的起始正式关卡 ID', 'error');
            return;
        }
    }

    const btn = document.getElementById('batchConfirmBtn');
    btn.disabled = true;
    btn.textContent = '导入中...';
    showBatchFeedback('');
    try {
        const resp = await fetch('/api/batch-copy-levels', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                sourceLevelIds: ids,
                sourceDir: LEVEL_DIR,
                sourceKind: LEVEL_KIND,
                targetType: 'online',
                startTargetLevelId,
                overwrite: batchOverwriteAllowed,
            }),
        });
        const result = await resp.json();
        if (!resp.ok || !result.ok) {
            if (result.exists && Array.isArray(result.conflicts)) {
                const preview = result.conflicts
                    .slice(0, 8)
                    .map(item => `#${item.targetLevelId}`)
                    .join('、');
                const more = result.conflicts.length > 8 ? ` 等 ${result.conflicts.length} 个` : '';
                showBatchFeedback(`目标 ${preview}${more} 已存在，再次确认将覆盖这些正式关卡`, 'error');
                batchOverwriteAllowed = true;
                btn.textContent = '确认覆盖导入';
                btn.disabled = false;
                return;
            }
            throw new Error(result.error || `HTTP ${resp.status}`);
        }
        for (const item of result.results || []) {
            if (!item.officialImport) continue;
            const level = levels.find(entry => Number(entry.levelId) === Number(item.sourceLevelId));
            if (level) level.officialImport = item.officialImport;
            const mapEntry = levelEntryMap.get(Number(item.sourceLevelId));
            if (mapEntry) mapEntry.officialImport = item.officialImport;
        }
        rememberOnlineImportNextLevelId(result.startTargetLevelId || 1, result.count || 1);
        showBatchFeedback(`已成功导入 ${result.count || ids.length} 关`, 'success');
        selectedLevelIds.clear();
        batchOverwriteAllowed = false;
        updateBatchStatus();
        renderAll();
        setTimeout(() => closeBatchImportModal(), 1500);
    } catch (error) {
        showBatchFeedback(`批量导入失败: ${error.message}`, 'error');
        batchOverwriteAllowed = false;
    } finally {
        setTimeout(() => {
            btn.disabled = false;
            if (!batchOverwriteAllowed) {
                btn.textContent = '确认批量导入';
            }
        }, 1200);
    }
}

(async () => {
    initDirectoryControls();
    await loadDefaultNextLevelId();
    document.getElementById('filterCard').value = CARD_FILTER;
    updateDirectoryHeader();
    initBatchControls();
    if (START_LEVEL > 0) {
        document.getElementById('startBadge').style.display = 'inline-block';
        document.getElementById('startBadgeNum').textContent = START_LEVEL;
        document.getElementById('startInput').value = START_LEVEL;
    }
    let title = BASE_TITLE;
    if (!IS_FORMAL_MAIN_DIR) {
        title += ` - ${getLevelDirDisplayName()}`;
    }
    if (START_LEVEL > 0) {
        title += ` (从${START_LEVEL}关起)`;
    }
    document.querySelector('.header h1').textContent = title;
    try {
        await discoverLevels();
        refreshImportStatus();
        await loadMoreLevels();
        document.getElementById('loading').style.display = 'none';
        renderAll();
    } catch (error) {
        document.getElementById('loading').textContent = `加载失败: ${error.message}`;
        updateStats();
    }
})();

<script>
function getSwapIds() {
    return {
        levelA: parseInt(document.getElementById('swapLevelA').value, 10),
        levelB: parseInt(document.getElementById('swapLevelB').value, 10),
    };
}

function getSwapTargetType() {
    return IS_THEME_LEVEL_DIR ? 'theme' : 'online';
}

function getSwapLevelLabel() {
    return IS_THEME_LEVEL_DIR ? '主题关卡' : '正式关卡';
}

function getSwapTargetFilename(levelId) {
    return `${IS_THEME_LEVEL_DIR ? 'zt_level' : 'level'}_${levelId}.json`;
}

function updateSwapConfirmState() {
    const btn = document.getElementById('swapConfirmBtn');
    if (!btn) return;
    btn.disabled = false;
}

function handleSwapInput() {
    updateSwapHint();
    updateSwapConfirmState();
}

function updateSwapHint() {
    const { levelA, levelB } = getSwapIds();
    const hint = document.getElementById('swapTargetHint');
    if (!levelA || !levelB) {
        hint.textContent = `请填写两个${getSwapLevelLabel()} ID`;
        return;
    }
    hint.textContent = `将交换 assets/LevelData/${getSwapTargetFilename(levelA)} 和 ${getSwapTargetFilename(levelB)}`;
}

function showSwapFeedback(msg, type = '') {
    const el = document.getElementById('swapFeedback');
    el.textContent = msg;
    el.className = 'copy-feedback' + (type ? ' ' + type : '');
}

function openSwapModal(defaultLevelA = '') {
    const label = getSwapLevelLabel();
    const targetType = getSwapTargetType();
    document.getElementById('swapTitle').textContent = `交换${label}`;
    document.getElementById('swapSubTitle').textContent = `会先备份两个原文件，再交换内容并修正 levelId。目标类型: ${targetType === 'theme' ? 'zt_level_*.json' : 'level_*.json'}`;
    document.getElementById('swapLevelA').value = defaultLevelA || '';
    document.getElementById('swapLevelB').value = '';
    showSwapFeedback('');
    handleSwapInput();
    document.getElementById('swapOverlay').classList.add('active');
    document.getElementById(defaultLevelA ? 'swapLevelB' : 'swapLevelA').focus();
}

function closeSwapModal() {
    document.getElementById('swapOverlay').classList.remove('active');
    document.getElementById('swapLevelA').value = '';
    document.getElementById('swapLevelB').value = '';
    showSwapFeedback('');
    handleSwapInput();
}

async function executeLevelSwap() {
    const { levelA, levelB } = getSwapIds();
    if (!levelA || !levelB || levelA < 1 || levelB < 1) {
        showSwapFeedback(`请填写两个有效的${getSwapLevelLabel()} ID`, 'error');
        return;
    }
    if (levelA === levelB) {
        showSwapFeedback('两个关卡 ID 不能相同', 'error');
        return;
    }
    if (!window.confirm(`确认交换${getSwapLevelLabel()} ${levelA} 和 ${levelB}？\n会先备份原文件，再交换内容。`)) {
        return;
    }

    const btn = document.getElementById('swapConfirmBtn');
    btn.disabled = true;
    btn.textContent = '交换中...';
    showSwapFeedback('');
    try {
        const resp = await fetch('/api/swap-formal-levels', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ levelA, levelB, targetType: getSwapTargetType() }),
        });
        const result = await resp.json();
        if (!resp.ok || !result.ok) {
            throw new Error(result.error || `HTTP ${resp.status}`);
        }
        showSwapFeedback(`已交换，备份在 ${result.backupDir}。页面即将刷新。`, 'success');
        setTimeout(() => window.location.reload(), 1500);
    } catch (error) {
        showSwapFeedback(`交换失败: ${error.message}`, 'error');
    } finally {
        setTimeout(() => {
            updateSwapConfirmState();
            btn.textContent = '确认交换';
        }, 1200);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const swapA = document.getElementById('swapLevelA');
    const swapB = document.getElementById('swapLevelB');
    if (swapA) swapA.addEventListener('input', handleSwapInput);
    if (swapB) swapB.addEventListener('input', handleSwapInput);
    updateSwapConfirmState();
});

let copySourceId = null;
let copyType = 'online';
let copyOverwriteAllowed = false;
let copyMode = 'import';

function getCopyConfirmText() {
    return '确认导入';
}

function getCopyTargetFilename(type, id) {
    return `${type === 'theme' ? 'zt_level' : 'level'}_${id}.json`;
}

function getCopySourcePath(levelId) {
    const data = levels.find(item => Number(item.levelId) === Number(levelId)) || { levelId };
    return getLevelFilePath(data);
}

async function openCopyModal(levelId, options = {}) {
    copySourceId = levelId;
    copyMode = 'import';
    copyOverwriteAllowed = false;
    document.getElementById('copyTitle').textContent = '导入关卡到正式/主题';
    document.getElementById('copySourceInfo').textContent = `来源: ${getCopySourcePath(levelId)}`;
    document.getElementById('copyFeedback').textContent = '';
    document.getElementById('copyFeedback').className = 'copy-feedback';
    document.getElementById('segOnline').textContent = '正式关卡 level_*.json';
    document.getElementById('segTheme').textContent = '主题挑战 zt_level_***.json';
    document.getElementById('copyTypeLabel').style.display = '';
    document.getElementById('copyTypeRow').style.display = '';
    document.getElementById('copyConfirmBtn').textContent = getCopyConfirmText();
    if (copyMode === 'import' && defaultNextLevelId === null) {
        await loadDefaultNextLevelId();
    }
    setCopyType('online');
    const existingImport = copyMode === 'import' ? getOfficialImportForLevel(levelId) : null;
    if (existingImport?.targetLevelId) {
        document.getElementById('copyTargetId').value = '';
        updateCopyTargetHint();
        showCopyFeedback(
            `这关已导入到正式第 ${existingImport.targetLevelId} 关：${existingImport.targetPath || ''}`,
            'success'
        );
    }
    const existingImportText = getImportBadgeText(levelId);
    if (existingImportText) {
        showCopyFeedback(`这关已导入：${existingImportText}`, 'success');
    }
    updateCopyQuickRow();
    document.getElementById('copyOverlay').classList.add('active');
    document.getElementById('copyTargetId').focus();
}

function closeCopyModal() {
    document.getElementById('copyOverlay').classList.remove('active');
    document.getElementById('copyTargetId').value = '';
    document.getElementById('copyFeedback').textContent = '';
    document.getElementById('copyFeedback').className = 'copy-feedback';
    updateCopyTargetHint();
    copySourceId = null;
}

function setCopyType(type) {
    copyType = type;
    document.getElementById('segOnline').classList.toggle('active', type === 'online');
    document.getElementById('segTheme').classList.toggle('active', type === 'theme');
    document.getElementById('copySourceInfo').textContent = type === 'online'
        ? `来源: ${getCopySourcePath(copySourceId)} | 正式导入仅保留运行所需字段`
        : `来源: ${getCopySourcePath(copySourceId)} | 主题导入保留主题所需附加字段`;
    const target = document.getElementById('copyTargetId');
    target.value = '';
    copyOverwriteAllowed = false;
    updateCopyTargetHint();
    updateCopyQuickRow();
}

function updateCopyTargetHint() {
    const rawValue = document.getElementById('copyTargetId').value.trim();
    if (!rawValue) {
        document.getElementById('copyTargetHint').textContent = '请选择或输入目标关卡 ID';
        updateCopyConfirmState();
        return;
    }
    const id = parseInt(rawValue, 10);
    if (!id || id < 1) {
        document.getElementById('copyTargetHint').textContent = '请输入有效的目标关卡 ID';
        updateCopyConfirmState();
        return;
    }
    document.getElementById('copyTargetHint').textContent =
        `目标文件: assets/LevelData/${getCopyTargetFilename(copyType, id)}`;
    updateCopyConfirmState();
}

function updateCopyConfirmState() {
    const btn = document.getElementById('copyConfirmBtn');
    const input = document.getElementById('copyTargetId');
    if (!btn || !input) return;
    const id = parseInt(input.value, 10);
    btn.disabled = !id || id < 1;
}

document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('copyTargetId');
    if (input) {
        input.addEventListener('input', updateCopyTargetHint);
        input.addEventListener('input', resetCopyOverwriteState);
    }
    updateCopyConfirmState();
});

function resetCopyOverwriteState() {
    copyOverwriteAllowed = false;
    const btn = document.getElementById('copyConfirmBtn');
    if (btn) btn.textContent = getCopyConfirmText();
}

function updateCopyQuickRow() {
    const container = document.getElementById('copyQuickRow');
    container.innerHTML = '';
    let ids = [];
    if (copyType === 'online') {
        const base = Math.max(1, getDefaultAppendLevelId());
        ids = [base, base + 1, base + 2, 100, 200, 300];
    } else {
        ids = [1001, 1002, 1003, 1004, 1101, 1201, 1301];
    }
    ids = [...new Set(ids)];
    for (const id of ids) {
        const chip = document.createElement('span');
        chip.className = 'quick-chip';
        chip.textContent = `第 ${id} 关`;
        chip.onclick = () => {
            document.getElementById('copyTargetId').value = id;
            resetCopyOverwriteState();
            updateCopyTargetHint();
        };
        container.appendChild(chip);
    }
}

async function executeCopy() {
    if (!copySourceId) return;
    const targetId = parseInt(document.getElementById('copyTargetId').value);
    if (!targetId || targetId < 1) {
        showCopyFeedback('请填写有效的目标关卡 ID', 'error');
        return;
    }
    const btn = document.getElementById('copyConfirmBtn');
    btn.disabled = true;
    btn.textContent = '导入中...';
    showCopyFeedback('', '');
    try {
        const resp = await fetch('/api/copy-level', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                sourceLevelId: copySourceId,
                sourceDir: LEVEL_DIR,
                sourceKind: LEVEL_KIND,
                targetType: copyType,
                targetLevelId: targetId,
                overwrite: copyOverwriteAllowed,
            }),
        });
        const result = await resp.json();
        if (!resp.ok || !result.ok) {
            if (result.exists) {
                showCopyFeedback(`目标 ${getCopyTargetFilename(copyType, targetId)} 已存在！再次点击将覆盖`, 'error');
                copyOverwriteAllowed = true;
                btn.textContent = '确认覆盖导入';
                btn.disabled = false;
                return;
            }
            throw new Error(result.error || '导入失败');
        }
        showCopyFeedback(`已成功导入到 ${result.targetPath}`, 'success');
        if (copyType === 'online') {
            rememberOnlineImportNextLevelId(targetId, 1);
        }
        if (result.officialImport) {
            const level = levels.find(item => Number(item.levelId) === Number(copySourceId));
            if (level) level.officialImport = result.officialImport;
            const entry = levelEntryMap.get(Number(copySourceId));
            if (entry) entry.officialImport = result.officialImport;
            renderAll();
        }
        copyOverwriteAllowed = false;
        btn.textContent = '完成';
        setTimeout(() => closeCopyModal(), 1800);
    } catch (e) {
        showCopyFeedback(e.message, 'error');
        copyOverwriteAllowed = false;
    } finally {
        setTimeout(() => {
            btn.disabled = false;
            if (!copyOverwriteAllowed) {
                btn.textContent = getCopyConfirmText();
            }
        }, 2000);
    }
}

function showCopyFeedback(msg, type) {
    const el = document.getElementById('copyFeedback');
    el.textContent = msg;
    el.className = 'copy-feedback' + (type ? ' ' + type : '');
}
</script>
