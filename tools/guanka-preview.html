<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼豆豆 - 关卡预览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f0e8; color: #3a3020; }
.header { background: linear-gradient(135deg, #4a6fa5, #3b4d8c); color: #fff; padding: 14px 28px 12px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,.15); display: flex; flex-direction: column; align-items: stretch; gap: 10px; overflow-x: hidden; }
.header-top { display: grid; grid-template-columns: minmax(280px, 0.9fr) minmax(520px, 1.4fr); gap: 14px; align-items: center; min-width: 0; }
.header-title-block { min-width: 0; }
.header h1 { font-size: 22px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header .stats { margin-top: 4px; font-size: 13px; line-height: 1.4; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dir-summary { margin-top: 2px; font-size: 12px; line-height: 1.4; opacity: .76; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.controls { display: flex; gap: 10px; margin-left: 0; align-items: center; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }
.controls select, .controls input { padding: 6px 10px; border: 1px solid rgba(255,255,255,.3); border-radius: 6px; background: rgba(255,255,255,.15); color: #fff; font-size: 13px; }
.controls select option { color: #333; background: #fff; }
.controls input::placeholder { color: rgba(255,255,255,.5); }
.dir-control { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 4px 6px; border-radius: 8px; background: rgba(255,255,255,.12); position: relative; z-index: 2; }
.dir-control .dir-label { font-size: 13px; font-weight: 600; white-space: nowrap; }
.dir-control input { flex: 1 1 auto; width: auto; min-width: 180px; max-width: none; pointer-events: auto; cursor: text; text-overflow: ellipsis; }
.dir-control select { flex: 0 0 auto; max-width: 140px; }
.dir-control .control-btn { flex: 0 0 auto; }
.control-btn { padding: 6px 10px; border: 1px solid rgba(255,255,255,.28); border-radius: 6px; background: rgba(255,255,255,.18); color: #fff; font-size: 13px; cursor: pointer; transition: background .15s, opacity .15s; }
.control-btn:hover { background: rgba(255,255,255,.26); }
.control-btn:disabled { opacity: .65; cursor: wait; }
.import-status { font-size: 12px; opacity: .92; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.import-status.error { color: #ffd3d3; }
.import-status.success { color: #d7ffd8; }
#imageImportInput { display: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; padding: 20px; max-width: 1400px; margin: 0 auto; }
.card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); transition: transform .15s, box-shadow .15s; cursor: pointer; position: relative; }
.card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.card .preview { display: flex; justify-content: center; align-items: center; padding: 12px; background: #faf8f4; min-height: 120px; position: relative; }
.card .preview .col { text-align: center; }
.card .preview .col .label { font-size: 10px; color: #999; margin-bottom: 2px; }
.card canvas { border-radius: 6px; }
.special-badges { position: absolute; top: 8px; left: 8px; display: flex; gap: 4px; pointer-events: none; z-index: 3; }
.special-badge { width: 24px; height: 24px; border-radius: 6px; background: #e9f9d9; border: 1px solid rgba(63,146,196,.35); box-shadow: 0 1px 4px rgba(0,0,0,.12); display: flex; align-items: center; justify-content: center; }
.special-clock-icon { width: 15px; height: 15px; border: 2px solid #55a8dc; border-radius: 50%; position: relative; background: rgba(255,255,255,.72); }
.special-clock-icon::before { content: ''; position: absolute; left: 6px; top: 3px; width: 2px; height: 5px; border-radius: 2px; background: #55a8dc; }
.special-clock-icon::after { content: ''; position: absolute; left: 6px; top: 7px; width: 5px; height: 2px; border-radius: 2px; background: #55a8dc; transform: rotate(28deg); transform-origin: left center; }
.special-region-icon { width: 15px; height: 15px; border-radius: 4px; position: relative; background: #6dbde9; box-shadow: inset 0 0 0 2px rgba(255,255,255,.9); }
.special-region-icon::before { content: ''; position: absolute; left: 6px; top: 2px; bottom: 2px; width: 2px; background: rgba(255,255,255,.9); border-radius: 2px; }
.special-region-icon::after { content: ''; position: absolute; top: 6px; left: 2px; right: 2px; height: 2px; background: rgba(255,255,255,.9); border-radius: 2px; }
.card .info { padding: 10px 14px; border-top: 1px solid #f0ebe0; }
.card .info .title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.card .info .meta { font-size: 12px; color: #888; line-height: 1.6; }
.card .info .meta span { display: inline-block; margin-right: 8px; }
.card .actions { padding: 8px 14px 12px; display: flex; gap: 8px; }
.card .actions a { flex: 1; text-align: center; padding: 6px; border-radius: 6px; font-size: 12px; text-decoration: none; font-weight: 500; transition: background .15s; }
.btn-play { background: #4a6fa5; color: #fff; }
.btn-play:hover { background: #3b5d8c; }
.btn-edit { background: #f0ebe0; color: #5a5040; }
.btn-edit:hover { background: #e5dfd0; }
.btn-shuffle { background: #e8a030; color: #fff; }
.btn-shuffle:hover { background: #d09020; }
.btn-online { background: #d8e9db; color: #5d7862; border: none; cursor: pointer; padding: 6px; border-radius: 6px; font-size: 14px; transition: all .15s; flex: 1; }
.btn-online.active { background: #59b66d; color: #fff; }
.btn-online:hover { background: #bdd9c2; }
.btn-featured { background: #ddd; color: #888; border: none; cursor: pointer; padding: 6px; border-radius: 6px; font-size: 14px; transition: all .15s; flex: 1; }
.btn-featured.active { background: #ffeaa7; color: #d4a000; }
.btn-featured:hover { background: #f0e0a0; }
.btn-copy { background: #e7eef9; color: #4a6fa5; border: none; cursor: pointer; padding: 6px; border-radius: 6px; font-size: 14px; transition: all .15s; flex: 1; }
.btn-copy:hover { background: #d2dcef; }
.btn-swap-card { background: #eef1f6; color: #51647d; border: none; cursor: pointer; padding: 6px; border-radius: 6px; font-size: 14px; transition: all .15s; flex: 1; }
.btn-swap-card:hover { background: #dde4ee; }
.batch-controls { display: none; align-items: center; gap: 8px; }
.batch-controls.active { display: flex; }
.batch-status { font-size: 12px; opacity: .9; white-space: nowrap; }
.card.batch-mode { cursor: pointer; }
.card.selected { box-shadow: 0 0 0 3px #4a6fa5, 0 2px 8px rgba(0,0,0,.08); }
.select-check { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 6px; border: 2px solid #4a6fa5; background: #fff; color: #4a6fa5; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; z-index: 2; }
.card.selected .select-check { background: #4a6fa5; color: #fff; }

/* Copy modal */
.copy-modal { background: #fff; border-radius: 14px; max-width: 460px; width: 92%; padding: 22px; position: relative; box-shadow: 0 18px 40px rgba(0,0,0,.25); }
.copy-modal h3 { font-size: 18px; margin-bottom: 4px; }
.copy-modal .copy-sub { font-size: 12px; color: #888; margin-bottom: 16px; }
.copy-modal label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; margin-top: 12px; font-weight: 500; }
.copy-modal .seg-row { display: flex; gap: 6px; }
.copy-modal .seg-btn { flex: 1; padding: 8px 10px; border: 1px solid #d4d4d4; background: #f7f7f7; color: #444; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }
.copy-modal .seg-btn.active { background: #4a6fa5; color: #fff; border-color: #4a6fa5; }
.copy-modal input[type=number] { width: 100%; padding: 8px 10px; border: 1px solid #d4d4d4; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
.copy-modal .quick-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.copy-modal .quick-chip { padding: 4px 10px; background: #eef1f6; color: #4a6fa5; border: 1px solid transparent; border-radius: 999px; cursor: pointer; font-size: 11px; }
.copy-modal .quick-chip:hover { background: #dbe2ee; }
.copy-modal .copy-actions { margin-top: 18px; display: flex; gap: 10px; }
.copy-modal .copy-actions button { flex: 1; padding: 10px 12px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
.copy-modal .btn-confirm { background: #4a6fa5; color: #fff; }
.copy-modal .btn-confirm:hover { background: #3b5d8c; }
.copy-modal .btn-confirm:disabled,
.copy-modal .btn-confirm:disabled:hover { background: #9db2d4; color: #fff; cursor: not-allowed; }
.copy-modal .btn-cancel { background: #eee; color: #555; }
.copy-modal .copy-feedback { font-size: 12px; margin-top: 10px; min-height: 18px; line-height: 1.5; }
.copy-modal .copy-feedback.error { color: #d8513f; }
.copy-modal .copy-feedback.success { color: #4a8e5e; }
.copy-modal .copy-target-hint { font-size: 12px; color: #888; margin-top: 4px; }
.dir-modal { background: #fff; border-radius: 14px; max-width: 680px; width: 92%; padding: 22px; position: relative; box-shadow: 0 18px 40px rgba(0,0,0,.25); }
.dir-modal h3 { font-size: 18px; margin-bottom: 4px; }
.dir-modal .dir-sub { font-size: 12px; color: #777; margin-bottom: 14px; word-break: break-all; }
.dir-modal label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; font-weight: 500; }
.dir-path-row { display: flex; gap: 8px; margin-bottom: 14px; }
.dir-path-row input { flex: 1; min-width: 0; padding: 9px 10px; border: 1px solid #d4d4d4; border-radius: 8px; font-size: 13px; }
.dir-path-row button { flex: 0 0 auto; padding: 9px 14px; border: none; border-radius: 8px; background: #4a6fa5; color: #fff; cursor: pointer; font-weight: 600; }
.dir-list-title { font-size: 12px; color: #666; margin: 8px 0 6px; font-weight: 600; }
.dir-list { max-height: 360px; overflow-y: auto; border: 1px solid #e5e1d8; border-radius: 10px; background: #fbfaf7; }
.dir-option { width: 100%; display: block; padding: 11px 12px; text-align: left; border: 0; border-bottom: 1px solid #ece7dc; background: transparent; cursor: pointer; color: #3a3020; }
.dir-option:last-child { border-bottom: 0; }
.dir-option:hover { background: #f1eadf; }
.dir-option.active { background: #e8f2ea; box-shadow: inset 3px 0 0 #59b66d; }
.dir-option-title { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 700; }
.dir-option-path { margin-top: 3px; font-size: 12px; color: #6f685c; word-break: break-all; }
.dir-option-meta { flex: 0 0 auto; font-size: 12px; color: #8a8174; font-weight: 500; }
.dir-empty { padding: 18px; color: #888; font-size: 13px; text-align: center; }
.dir-modal-actions { margin-top: 14px; display: flex; justify-content: flex-end; }
.dir-modal-actions button { padding: 9px 16px; border: none; border-radius: 8px; background: #eee; color: #555; cursor: pointer; font-weight: 600; }
.card.featured { position: relative; box-shadow: 0 0 0 2px #f0c040, 0 2px 8px rgba(0,0,0,.08); }
.card.online { box-shadow: 0 0 0 2px #59b66d, 0 2px 8px rgba(0,0,0,.08); }
.card.featured.online { box-shadow: 0 0 0 2px #59b66d, 0 0 0 4px #f0c040, 0 2px 8px rgba(0,0,0,.08); }
.card.imported { position: relative; }
.badge-featured { position: absolute; top: 6px; right: 6px; background: #f0c040; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; pointer-events: none; }
.badge-online { position: absolute; top: 6px; left: 6px; background: #59b66d; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; pointer-events: none; }
.badge-imported { position: absolute; top: 6px; left: 6px; background: #4f6fa6; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; pointer-events: none; }

/* Detail modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; justify-content: center; align-items: center; }
.modal-overlay.active { display: flex; }
.modal { background: #fff; border-radius: 16px; max-width: 800px; width: 90%; max-height: 90vh; overflow-y: auto; padding: 24px; }
.modal h2 { font-size: 20px; margin-bottom: 16px; }
.modal .compare { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
.modal .compare .col { text-align: center; }
.modal .compare .col h3 { font-size: 14px; color: #888; margin-bottom: 8px; }
.modal .compare canvas { border-radius: 8px; border: 1px solid #eee; }
.modal .detail-meta { margin-top: 16px; font-size: 13px; color: #666; line-height: 1.8; }
.modal .detail-actions { margin-top: 16px; display: flex; gap: 10px; }
.modal .detail-actions a { padding: 8px 20px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500; }
.modal .close-btn { position: absolute; top: 12px; right: 16px; font-size: 24px; cursor: pointer; color: #aaa; background: none; border: none; }
.loading { text-align: center; padding: 60px; font-size: 16px; color: #999; }

.color-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 2px; vertical-align: middle; }
@media (max-width: 900px) {
    .header-top { grid-template-columns: 1fr; }
    .controls { justify-content: flex-start; }
    .dir-control input { min-width: 180px; }
}
</style>
</head>
<body>

<div class="header">
    <div class="header-top">
        <div class="header-title-block">
            <h1>🎮 拼豆豆 关卡预览</h1>
            <div class="stats" id="stats">加载中...</div>
            <div class="dir-summary" id="dirSummary">目录: assets/LevelData</div>
        </div>
        <div class="dir-control">
            <span id="dirBadge" class="dir-label">目录</span>
            <input type="text" id="dirInput" placeholder="assets/LevelData">
            <button id="dirApplyBtn" class="control-btn" type="button">切换</button>
            <button id="dirPickerBtn" class="control-btn" type="button">选择目录</button>
            <select id="dirPreset">
                <option value="">常用目录</option>
                <option value="assets/LevelData::main">正式关卡</option>
                <option value="assets/LevelData::theme">主题关卡</option>
                <option value="tools/competitors/拼豆1000关/levels/main::main">拼豆1000关 主线</option>
                <option value="tools/competitors/全民拼豆/levels/main::main">全民拼豆 主线</option>
                <option value="tools/competitors/全民拼豆/levels/daily::main">全民拼豆 Daily</option>
                <option value="tools/competitors/拼豆解解压/levels/main::main">拼豆解解压 主线</option>
                <option value="tools/competitors/拼豆解解压/levels/daily::main">拼豆解解压 Daily</option>
                <option value="tools/competitors/拼豆达人赛/levels/main::main">拼豆达人赛 主线</option>
                <option value="tools/competitors/快乐拼拼豆/levels/main::main">快乐拼拼豆 主线</option>
                <option value="tools/competitors/拼豆天才/levels/main::main">拼豆天才 主线</option>
                <option value="tools/competitors/拼豆天才/levels/daily::main">拼豆天才 Daily</option>
            </select>
        </div>
    </div>
    <div class="controls">
        <span id="startBadge" style="font-size:13px;background:rgba(255,255,255,.2);padding:4px 8px;border-radius:6px;display:none;">从第 <b id="startBadgeNum"></b> 关开始</span>
        <input type="number" id="startInput" placeholder="起始关卡" size="8" min="0" style="width:90px;">
        <button id="startBtn" style="padding:6px 10px;border:1px solid rgba(255,255,255,.3);border-radius:6px;background:rgba(255,255,255,.2);color:#fff;font-size:13px;cursor:pointer;">跳转</button>
        <select id="filterColors">
            <option value="0">全部颜色数</option>
            <option value="2">2色</option>
            <option value="3">3色</option>
            <option value="4">4色</option>
            <option value="5">5色</option>
            <option value="6">6+色</option>
        </select>
        <select id="filterCard">
            <option value="all">全部关卡</option>
            <option value="imported">已导入</option>
            <option value="notImported">未导入</option>
            <option value="featured">精选</option>
        </select>
        <input type="file" id="imageImportInput" accept="image/*">
        <div id="batchControls" class="batch-controls">
            <button id="batchSelectBtn" class="control-btn" type="button">批量选择</button>
            <button id="batchImportBtn" class="control-btn" type="button">批量导入</button>
            <span id="batchStatus" class="batch-status">已选 0 关</span>
        </div>
        <button id="imageImportBtn" class="control-btn" type="button">上传图片生成关卡</button>
        <span id="importStatus" class="import-status">默认追加到最后一关</span>
    </div>
</div>

<div class="grid" id="grid"></div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modal"></div>
</div>

<div class="modal-overlay" id="dirOverlay" onclick="if(event.target===this)closeDirPicker()">
    <div class="dir-modal" id="dirModal">
        <h3>选择关卡目录</h3>
        <div class="dir-sub">当前: <span id="dirCurrentText">assets/LevelData</span></div>

        <label>项目内相对路径</label>
        <div class="dir-path-row">
            <input type="text" id="dirModalInput" placeholder="assets/LevelData">
            <button type="button" id="dirModalApplyBtn">切换</button>
        </div>

        <div class="dir-list-title">可用目录</div>
        <div class="dir-list" id="dirPickerList">
            <div class="dir-empty">正在扫描目录...</div>
        </div>

        <div class="dir-modal-actions">
            <button type="button" onclick="closeDirPicker()">关闭</button>
        </div>
    </div>
</div>

<div class="loading" id="loading">正在加载关卡数据...</div>

<script>
const COLOR_HEX = {
    1: '#ED5090', 2: '#4EEAEA', 3: '#F8C811', 4: '#FE8B10', 5: '#F4BD9E',
    6: '#EBDEA6', 7: '#4A4DCF', 8: '#7221BC', 9: '#9FCE21', 10: '#EA281A',
    11: '#37A92D', 12: '#207955', 13: '#20A8DC', 14: '#EEB2BC', 15: '#C4BED9',
    16: '#974714', 17: '#782F3C', 18: '#36387E', 19: '#373737', 20: '#F2EDE4',
};
const PNG_HEX = {
    1: '#ED5090', 2: '#4EEAEA', 3: '#F8C811', 4: '#FE8B10', 5: '#F4BD9E',
    6: '#EBDEA6', 7: '#4A4DCF', 8: '#7221BC', 9: '#9FCE21', 10: '#EA281A',
    11: '#37A92D', 12: '#207955', 13: '#20A8DC', 14: '#EEB2BC', 15: '#C4BED9',
    16: '#974714', 17: '#782F3C', 18: '#36387E', 19: '#373737', 20: '#F2EDE4',
    21: '#8B8B8B',
};
const COLOR_NAMES = {
    1: '玫红', 2: '亮青', 3: '金', 4: '橙', 5: '桃', 6: '浅黄', 7: '靛蓝', 8: '紫',
    9: '绿', 10: '红', 11: '青绿', 12: '翠绿', 13: '天蓝', 14: '粉', 15: '浅紫',
    16: '棕', 17: '酒红', 18: '藏青', 19: '深灰', 20: '米白',
};
const COLOR_IDS = Object.keys(COLOR_HEX).map(Number);
const COLOR_RGB = Object.fromEntries(
    Object.entries(COLOR_HEX).map(([id, hex]) => [Number(id), hexToRgb(hex)])
);
const IMPORT_MAX_SIDE = 32;
const IMPORT_SAMPLE_SCALE = 8;
const IMPORT_MIN_FOREGROUND_ALPHA = 36;
const IMPORT_EMPTY_CELL_COVERAGE = 0.08;
const OFFICIAL_MAIN_ABNORMAL_ID_FLOOR = 10000;
const OFFICIAL_MAIN_ABNORMAL_ID_GAP = 1000;

let levels = [];
let levelIds = [];
let loadedUpTo = 0;
const levelPathMap = new Map();
const levelEntryMap = new Map();
const PAGE_SIZE = 100;
const BATCH_SIZE = 50;
let isLoadingMore = false;
let activeFilter = null; // { type, value }
let importStatusTimer = null;
let isImportingImage = false;
let defaultNextLevelId = null;
let availableLevelDirs = null;
let batchSelectMode = false;
const selectedLevelIds = new Set();
let batchOverwriteAllowed = false;
let batchStartMode = 'append';

// Parse start level from URL query string
const URL_PARAMS = new URLSearchParams(window.location.search);
const DEFAULT_LEVEL_DIR = 'assets/LevelData';
const DEFAULT_LEVEL_KIND = 'main';
const PRESET_LEVEL_DIR_ITEMS = [
    { label: '正式关卡', dir: DEFAULT_LEVEL_DIR, kind: 'main' },
    { label: '主题关卡', dir: DEFAULT_LEVEL_DIR, kind: 'theme' },
    { label: '拼豆1000关 主线', dir: 'tools/competitors/拼豆1000关/levels/main', kind: 'main' },
    { label: '全民拼豆 主线', dir: 'tools/competitors/全民拼豆/levels/main', kind: 'main' },
    { label: '全民拼豆 Daily', dir: 'tools/competitors/全民拼豆/levels/daily', kind: 'main' },
    { label: '拼豆解解压 主线', dir: 'tools/competitors/拼豆解解压/levels/main', kind: 'main' },
    { label: '拼豆解解压 Daily', dir: 'tools/competitors/拼豆解解压/levels/daily', kind: 'main' },
    { label: '拼豆达人赛 主线', dir: 'tools/competitors/拼豆达人赛/levels/main', kind: 'main' },
    { label: '快乐拼拼豆 主线', dir: 'tools/competitors/快乐拼拼豆/levels/main', kind: 'main' },
    { label: '拼豆天才 主线', dir: 'tools/competitors/拼豆天才/levels/main', kind: 'main' },
    { label: '拼豆天才 Daily', dir: 'tools/competitors/拼豆天才/levels/daily', kind: 'main' },
];
const PRESET_LEVEL_DIR_KEYS = PRESET_LEVEL_DIR_ITEMS.map(item => makeLevelDirKey(item.dir, item.kind));
const BASE_TITLE = '🎮 拼豆豆 关卡预览';

const LEVEL_DIR_KEY = makeLevelDirKey(LEVEL_DIR, LEVEL_KIND);
const IS_FORMAL_MAIN_DIR = LEVEL_DIR === DEFAULT_LEVEL_DIR && LEVEL_KIND === 'main';
const IS_THEME_LEVEL_DIR = LEVEL_DIR === DEFAULT_LEVEL_DIR && LEVEL_KIND === 'theme';
const IS_DEFAULT_LEVEL_DIR = IS_FORMAL_MAIN_DIR;
const CAN_IMPORT_TO_OFFICIAL = !IS_FORMAL_MAIN_DIR && !IS_THEME_LEVEL_DIR && LEVEL_KIND === 'main';
const CAN_SWAP_LEVELS = IS_FORMAL_MAIN_DIR || IS_THEME_LEVEL_DIR;
const SHOW_ONLINE_ACTION = !CAN_IMPORT_TO_OFFICIAL && !CAN_SWAP_LEVELS;
const GAME_PREVIEW_URL = 'http://localhost:7456/';

function normalizeLevelDir(value) {
    const raw = String(value || '').trim().replace(/\\/g, '/').replace(/^\/+|\/+$/g, '');
    if (!raw) return DEFAULT_LEVEL_DIR;
    const parts = raw.split('/').filter(Boolean);
    if (!parts.length) return DEFAULT_LEVEL_DIR;
    if (parts.some(part => part === '.' || part === '..')) {
        return DEFAULT_LEVEL_DIR;
    }
    return parts.join('/');
}

function normalizeLevelKind(value) {
    const kind = String(value || DEFAULT_LEVEL_KIND).trim().toLowerCase();
    return ['theme', 'zt', 'zt_level'].includes(kind) ? 'theme' : 'main';
}

function normalizeCardFilter(value) {
    const filter = String(value || '').trim();
    if (['imported', 'notImported', 'featured'].includes(filter)) return filter;
    return 'all';
}

function getInitialCardFilter() {
    const explicit = URL_PARAMS.get('filter') || URL_PARAMS.get('cardFilter');
    if (explicit) return normalizeCardFilter(explicit);
    if (URL_PARAMS.get('featured') === '1') return 'featured';
    const legacyOnline = URL_PARAMS.get('online') ? parseInt(URL_PARAMS.get('online')) : 0;
    if (legacyOnline === 1) return 'imported';
    if (legacyOnline === 2) return 'notImported';
    return 'all';
}

function makeLevelDirKey(dir = DEFAULT_LEVEL_DIR, kind = DEFAULT_LEVEL_KIND) {
    return `${normalizeLevelDir(dir)}::${normalizeLevelKind(kind)}`;
}

function parseLevelDirChoice(value, fallbackKind = DEFAULT_LEVEL_KIND) {
    const raw = String(value || '').trim();
    const separatorIndex = raw.lastIndexOf('::');
    if (separatorIndex >= 0) {
        return {
            dir: normalizeLevelDir(raw.slice(0, separatorIndex)),
            kind: normalizeLevelKind(raw.slice(separatorIndex + 2)),
        };
    }
    return {
        dir: normalizeLevelDir(raw || DEFAULT_LEVEL_DIR),
        kind: normalizeLevelKind(fallbackKind),
    };
}

function getManualApplyKind(value) {
    return normalizeLevelDir(value) === LEVEL_DIR ? LEVEL_KIND : DEFAULT_LEVEL_KIND;
}

function getLevelDirDisplayName(dir = LEVEL_DIR, kind = LEVEL_KIND) {
    const normalized = normalizeLevelDir(dir);
    const normalizedKind = normalizeLevelKind(kind);
    const preset = PRESET_LEVEL_DIR_ITEMS.find(
        item => item.dir === normalized && normalizeLevelKind(item.kind) === normalizedKind
    );
    if (preset) return preset.label;
    if (normalized === DEFAULT_LEVEL_DIR && normalizedKind === 'theme') return '主题关卡';
    if (normalized.startsWith('tools/competitors/')) {
        const parts = normalized.split('/').filter(Boolean);
        const gameName = parts[2] || '竞品';
        if (normalized.endsWith('/levels/main')) return `${gameName} 主线`;
        if (normalized.endsWith('/levels/daily')) return `${gameName} Daily`;
    }
    const parts = normalized.split('/').filter(Boolean);
    return parts.length > 1 ? parts.slice(-2).join('/') : normalized;
}

function updateDirectoryHeader() {
    const shortName = getLevelDirDisplayName();
    const fullLabel = LEVEL_KIND === 'main' ? LEVEL_DIR_LABEL : `${LEVEL_DIR_LABEL} | ${LEVEL_KIND}`;
    const badge = document.getElementById('dirBadge');
    const summary = document.getElementById('dirSummary');
    badge.textContent = `目录: ${shortName}`;
    badge.title = fullLabel;
    summary.textContent = `完整路径: ${fullLabel}`;
    summary.title = fullLabel;
}

function buildApiUrl(path, params = {}) {
    const url = new URL(path, window.location.origin);
    for (const [key, value] of Object.entries(params)) {
        if (value === undefined || value === null || value === '') continue;
        url.searchParams.set(key, String(value));
    }
    return url.toString();
}

function applyLevelDir(value, fallbackKind = DEFAULT_LEVEL_KIND) {
    const { dir: nextDir, kind: nextKind } = parseLevelDirChoice(value || DEFAULT_LEVEL_DIR, fallbackKind);
    const url = new URL(window.location);
    if (nextDir === DEFAULT_LEVEL_DIR) {
        url.searchParams.delete('dir');
    } else {
        url.searchParams.set('dir', nextDir);
    }
    if (nextKind === DEFAULT_LEVEL_KIND) {
        url.searchParams.delete('kind');
    } else {
        url.searchParams.set('kind', nextKind);
    }
    url.searchParams.delete('start');
    window.location.href = url.toString();
}

function initDirectoryControls() {

    const preset = document.getElementById('dirPreset');

    input.addEventListener('click', event => event.stopPropagation());
    document.getElementById('dirApplyBtn').addEventListener('click', () => applyLevelDir(input.value, getManualApplyKind(input.value)));
    document.getElementById('dirPickerBtn').addEventListener('click', openDirPicker);
    input.addEventListener('keydown', event => {

    });
    preset.addEventListener('change', () => {

    const modalInput = document.getElementById('dirModalInput');

    modalInput.addEventListener('keydown', event => {

    });
}

function mergeLevelDirChoices(scannedDirs = []) {
    const byKey = new Map();
    for (const item of PRESET_LEVEL_DIR_ITEMS) {
        const kind = normalizeLevelKind(item.kind);
        const key = makeLevelDirKey(item.dir, kind);
        byKey.set(key, {
            dir: item.dir,
            kind,
            key,
            label: item.label,
            count: null,
            firstLevelId: null,
            lastLevelId: null,
            isDefault: item.dir === DEFAULT_LEVEL_DIR && kind === 'main',
            isPreset: true,
        });
    }
    for (const item of scannedDirs) {
        const dir = normalizeLevelDir(item.dir);
        const kind = normalizeLevelKind(item.kind);
        const key = makeLevelDirKey(dir, kind);
        byKey.set(key, {
            ...byKey.get(key),
            ...item,
            dir,
            kind,
            key,
            label: item.label || byKey.get(key)?.label || getLevelDirDisplayName(dir, kind),
        });
    }
    return Array.from(byKey.values()).sort((a, b) => {
        if (a.dir === DEFAULT_LEVEL_DIR && a.kind === 'main') return -1;
        if (b.dir === DEFAULT_LEVEL_DIR && b.kind === 'main') return 1;
        if (a.dir === DEFAULT_LEVEL_DIR && a.kind === 'theme') return -1;
        if (b.dir === DEFAULT_LEVEL_DIR && b.kind === 'theme') return 1;
        if (a.dir.startsWith('tools/competitors/') && a.dir.endsWith('/levels/main')) return -1;
        if (b.dir.startsWith('tools/competitors/') && b.dir.endsWith('/levels/main')) return 1;
        return a.dir.localeCompare(b.dir);
    });
}

async function loadLevelDirChoices() {
    if (availableLevelDirs) return availableLevelDirs;
    try {
        const resp = await fetch(buildApiUrl('/api/list-level-dirs', { _: Date.now() }));
        const result = await resp.json();
        if (!resp.ok || !result.ok) throw new Error(result.error || `HTTP ${resp.status}`);
        availableLevelDirs = mergeLevelDirChoices(result.dirs || []);
    } catch (_) {
        availableLevelDirs = mergeLevelDirChoices([]);
    }
    return availableLevelDirs;
}

async function loadDefaultNextLevelId() {

            kind: DEFAULT_LEVEL_KIND,

function getLevelFilePath(data) {

function shouldUseDirectLevelParam(data) {

function buildPlayUrl(data) {

function buildRefineUrl(data) {

        url.searchParams.set('level', String(data.levelId));

// Discover all level IDs first
async function discoverLevels() {
    const resp = await fetch(buildApiUrl('/api/list-levels', { dir: LEVEL_DIR, kind: LEVEL_KIND, _: Date.now() }));
    const result = await resp.json();
    if (!resp.ok || !result.ok) {
        throw new Error(result.error || `HTTP ${resp.status}`);
    }

    levelIds = [];
    levelEntryMap.clear();
    levelPathMap.clear();
    const entries = Array.isArray(result.levels)
        ? result.levels
        : (result.levelIds || []).map(id => ({ levelId: id }));
    for (const entry of entries) {
        const id = Number(entry.levelId);
        if (id >= START_LEVEL) {
            levelIds.push(id);
            levelEntryMap.set(id, entry);
            if (entry.path) {
                levelPathMap.set(id, entry.path);
            }
        }
    }
    levelIds.sort((a, b) => a - b);
}

// Load the next PAGE_SIZE levels
async function loadMoreLevels() {
    if (loadedUpTo >= levelIds.length) return false;
    if (isLoadingMore) return false;
    isLoadingMore = true;
    const existingLevelIds = new Set(levels.map(level => level.levelId));

    const start = loadedUpTo;
    const end = Math.min(start + PAGE_SIZE, levelIds.length);
    const idsToLoad = levelIds.slice(start, end);
    const cacheBust = Date.now();

    document.getElementById('loading').textContent =
        `正在加载 ${LEVEL_DIR_LABEL} ... ${levels.length}/${levelIds.length}`;

    for (let i = 0; i < idsToLoad.length; i += BATCH_SIZE) {
        const batch = idsToLoad.slice(i, i + BATCH_SIZE);
        const promises = batch.map(id =>
            fetch(buildApiUrl('/api/load-level', { dir: LEVEL_DIR, kind: LEVEL_KIND, levelId: id, _: cacheBust }))
                .then(async r => {
                    if (!r.ok) return null;
                    const result = await r.json();
                    if (!result.ok || !result.levelData) return null;
                    if (result.path) {
                        levelPathMap.set(result.levelData.levelId, result.path);
                    }
                    const entry = levelEntryMap.get(Number(result.levelData.levelId));
                    if (entry?.officialImport) {
                        result.levelData.officialImport = entry.officialImport;
                    }
                    return result.levelData;
                })
                .catch(() => null)
        );
        const results = await Promise.all(promises);
        for (const data of results) {
            if (data && !existingLevelIds.has(data.levelId)) {
                levels.push(data);
                existingLevelIds.add(data.levelId);
            }
        }
    }

    levels.sort((a, b) => a.levelId - b.levelId);
    loadedUpTo = end;

    document.getElementById('loading').textContent = '';
    updateStats();

    isLoadingMore = false;
    return true;
}

function hexToRgb(hex) {
    const value = hex.replace('#', '');
    return {
        r: parseInt(value.slice(0, 2), 16),
        g: parseInt(value.slice(2, 4), 16),
        b: parseInt(value.slice(4, 6), 16),
    };
}

function clampNumber(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function weightedRgbDistance(a, b) {
    const dr = a.r - b.r;
    const dg = a.g - b.g;
    const db = a.b - b.b;
    return 2 * dr * dr + 4 * dg * dg + 3 * db * db;
}

function luminance(rgb) {
    return 0.2126 * rgb.r + 0.7152 * rgb.g + 0.0722 * rgb.b;
}

function getPalettePenalty(colorId, rgb) {
    const lum = luminance(rgb);
    let penalty = 0;
    if (colorId === 20 && lum < 176) {
        penalty += 10000 + (176 - lum) * 110;
    }
    if ([7, 8, 16, 17, 18, 19].includes(colorId) && lum > 214) {
        penalty += (lum - 214) * 125;
    }
    if ([3, 6, 14, 15, 20].includes(colorId) && lum < 72) {
        penalty += (72 - lum) * 120;
    }
    return penalty;
}

function findClosestColor(r, g, b) {
    const rgb = { r, g, b };
    let minDist = Infinity;
    let closest = 0;
    for (const id of COLOR_IDS) {
        const paletteRgb = COLOR_RGB[id];
        const score = weightedRgbDistance(rgb, paletteRgb) + getPalettePenalty(id, rgb);
        if (score < minDist) {
            minDist = score;
            closest = id;
        }
    }
    return closest;
}

function getNextGuankaLevelId() {
    if (!levelIds.length) return 1;
    if (IS_FORMAL_MAIN_DIR) return getSafeNextOfficialMainLevelId(levelIds);
    return levelIds[levelIds.length - 1] + 1;
}

function getSafeNextOfficialMainLevelId(ids) {
    let safeTail = 0;
    const sortedIds = [...ids].map(Number).filter(Number.isFinite).sort((a, b) => a - b);
    for (const id of sortedIds) {
        if (
            safeTail > 0
            && id >= OFFICIAL_MAIN_ABNORMAL_ID_FLOOR
            && id - safeTail >= OFFICIAL_MAIN_ABNORMAL_ID_GAP
        ) {
            break;
        }
        safeTail = id;
    }
    return safeTail + 1;
}

function getDefaultAppendLevelId() {
    if (IS_FORMAL_MAIN_DIR && Number.isInteger(defaultNextLevelId)) {
        return defaultNextLevelId;
    }
    return getNextGuankaLevelId();
}

function rememberOnlineImportNextLevelId(targetLevelId, count = 1) {
    const currentNext = getDefaultAppendLevelId();
    const numericTargetId = Number(targetLevelId);
    const numericCount = Math.max(1, Number(count) || 1);
    if (
        numericTargetId >= OFFICIAL_MAIN_ABNORMAL_ID_FLOOR
        && numericTargetId - currentNext >= OFFICIAL_MAIN_ABNORMAL_ID_GAP
    ) {
        return;
    }
    defaultNextLevelId = Math.max(defaultNextLevelId || 1, numericTargetId + numericCount);
}

function stripExtension(filename) {
