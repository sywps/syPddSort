<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼豆豆 - 数据日报看板</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #2a251f;
    background:
        radial-gradient(circle at top left, rgba(255, 214, 153, .35), transparent 24%),
        radial-gradient(circle at top right, rgba(140, 178, 255, .22), transparent 22%),
        linear-gradient(180deg, #fbf5ea 0%, #f5efe5 100%);
    min-height: 100vh;
}
.page {
    width: min(1480px, calc(100vw - 32px));
    margin: 0 auto;
    padding: 28px 0 40px;
}
.hero {
    background: linear-gradient(135deg, #4b6a9a, #2e4e7a 52%, #19324f);
    color: #fff;
    border-radius: 24px;
    padding: 26px 28px 24px;
    box-shadow: 0 18px 48px rgba(34, 50, 82, .25);
    position: sticky;
    top: 12px;
    z-index: 30;
}
.hero-top {
    display: flex;
    gap: 18px;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
}
.hero-title h1 {
    font-size: 30px;
    letter-spacing: .5px;
    margin-bottom: 8px;
}
.hero-title p {
    font-size: 14px;
    line-height: 1.6;
    opacity: .9;
    max-width: 680px;
}
.hero-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
}
.hero-controls input,
.hero-controls select,
.hero-controls button {
    height: 38px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.25);
    padding: 0 12px;
    background: rgba(255,255,255,.14);
    color: #fff;
    font-size: 14px;
}
.hero-controls select option { color: #2a251f; }
.hero-controls button {
    cursor: pointer;
    background: linear-gradient(135deg, #f5be62, #eb9e36);
    border: none;
    color: #34230c;
    font-weight: 700;
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.15);
}
.hero-controls button.secondary {
    background: rgba(255,255,255,.18);
    color: #fff;
    border: 1px solid rgba(255,255,255,.24);
    font-weight: 600;
}
.hero-meta {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}
.pill {
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
}
.grid {
    margin-top: 22px;
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 16px;
}
.card {
    background: rgba(255,255,255,.88);
    border: 1px solid rgba(191, 174, 152, .22);
    border-radius: 20px;
    box-shadow: 0 10px 26px rgba(93, 74, 48, .08);
    backdrop-filter: blur(10px);
    overflow: hidden;
}
.card-header {
    padding: 18px 20px 12px;
    border-bottom: 1px solid rgba(218, 206, 191, .48);
}
.card-title {
    font-size: 18px;
    font-weight: 700;
}
.card-subtitle {
    font-size: 12px;
    color: #7f7367;
    margin-top: 6px;
    line-height: 1.6;
}
.card-body { padding: 18px 20px 20px; }
.span-3 { grid-column: span 3; }
.span-4 { grid-column: span 4; }
.span-5 { grid-column: span 5; }
.span-6 { grid-column: span 6; }
.span-7 { grid-column: span 7; }
.span-8 { grid-column: span 8; }
.span-12 { grid-column: span 12; }
.metrics {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
}
.metric {
    background: linear-gradient(180deg, rgba(250,245,238,.92), rgba(245,237,226,.84));
    border-radius: 16px;
    padding: 16px 16px 14px;
    border: 1px solid rgba(214, 196, 176, .4);
}
.metric-label {
    font-size: 12px;
    color: #7d746b;
    margin-bottom: 8px;
}
.metric-value {
    font-size: 30px;
    font-weight: 800;
    line-height: 1;
    color: #2e3f66;
}
.metric-footnote {
    margin-top: 8px;
    font-size: 12px;
    color: #8e857a;
}
.section-list {
    display: grid;
    gap: 10px;
}
.list-row {
    background: #fbf8f2;
    border: 1px solid rgba(219, 206, 191, .52);
    border-radius: 14px;
    padding: 12px 14px;
}
.list-row strong {
    color: #354b72;
}
.bar-list {
    display: grid;
    gap: 10px;
}
.bar-item { display: grid; gap: 6px; }
.bar-meta {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    color: #5a5048;
}
.bar-track {
    width: 100%;
    height: 10px;
    background: #ece3d7;
    border-radius: 999px;
    overflow: hidden;
}
.bar-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #efb14f, #d56d3a);
}
.bar-fill.cool {
    background: linear-gradient(90deg, #69b2dc, #3f6cb4);
}
.bar-fill.good {
    background: linear-gradient(90deg, #70bf79, #3e9e57);
}
.two-col {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
}
.table-wrap {
    overflow-x: auto;
    border-radius: 16px;
    border: 1px solid rgba(217, 205, 191, .52);
    background: #fffdfa;
}
table {
    width: 100%;
    border-collapse: collapse;
    min-width: 680px;
}
th, td {
    padding: 12px 14px;
    text-align: left;
    border-bottom: 1px solid rgba(226, 216, 204, .75);
    font-size: 13px;
}
th {
    background: #f5efe6;
    color: #695b4f;
    position: sticky;
    top: 0;
    z-index: 1;
}
.sort-header {
    width: 100%;
    border: 0;
    background: transparent;
    color: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font: inherit;
    font-weight: 700;
    text-align: left;
}
.sort-header:hover {
    color: #2f456d;
}
.sort-indicator {
    color: #b09a7e;
    font-size: 11px;
    min-width: 12px;
}
.sort-indicator::before {
    content: "↕";
}
th[aria-sort="ascending"] .sort-indicator::before {
    content: "↑";
}
th[aria-sort="descending"] .sort-indicator::before {
    content: "↓";
}
td strong { color: #31486e; }
.empty, .loading, .error {
    padding: 34px 20px;
    text-align: center;
    color: #8e8377;
    font-size: 15px;
    line-height: 1.8;
}
.error { color: #b14f47; }
.link-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}
.link-row a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 12px;
    border-radius: 12px;
    background: #eef3fb;
    color: #315588;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
}
.summary-callout {
    border-radius: 16px;
    padding: 16px;
    background: linear-gradient(180deg, #f8f1e1, #f6ead1);
    border: 1px solid rgba(220, 187, 122, .42);
    display: grid;
    gap: 8px;
}
.summary-callout p {
    font-size: 13px;
    color: #5f4b2d;
    line-height: 1.65;
}
.insight-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
}
.insight-box {
    border-radius: 16px;
    padding: 16px;
    border: 1px solid rgba(215, 201, 180, .48);
    background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(247,241,233,.88));
}
.insight-box h3 {
    font-size: 14px;
    margin-bottom: 10px;
    color: #384f75;
}
.insight-box ul {
    display: grid;
    gap: 8px;
    padding-left: 18px;
}
.insight-box li {
    font-size: 13px;
    line-height: 1.6;
    color: #5c5248;
}
.trend-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
}
.trend-card {
    border-radius: 16px;
    padding: 14px;
    background: linear-gradient(180deg, rgba(250,246,239,.98), rgba(242,235,225,.9));
    border: 1px solid rgba(218, 205, 190, .5);
}
.trend-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 12px;
}
.trend-name {
    font-size: 13px;
    color: #7d746b;
}
.trend-value {
    font-size: 24px;
    font-weight: 800;
    color: #2f456d;
    line-height: 1.05;
}
.trend-delta {
    font-size: 12px;
    font-weight: 700;
    border-radius: 999px;
    padding: 4px 8px;
    white-space: nowrap;
}
.trend-delta.up {
    color: #2f8f50;
    background: rgba(108, 192, 130, .16);
}
.trend-delta.down {
    color: #b14f47;
    background: rgba(217, 105, 93, .14);
}
.trend-delta.flat {
    color: #876d3c;
    background: rgba(220, 187, 122, .16);
}
.trend-svg {
    width: 100%;
    height: 100px;
    display: block;
}
.trend-axis {
    font-size: 10px;
    fill: #8d8379;
}
.trend-labels {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    margin-top: 8px;
    font-size: 11px;
    color: #8e8377;
}
@media (max-width: 1100px) {
    .span-3, .span-4, .span-5, .span-6, .span-7, .span-8 { grid-column: span 12; }
    .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .two-col { grid-template-columns: 1fr; }
    .trend-grid, .insight-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 640px) {
    .page { width: min(100vw - 18px, 1480px); }
    .hero { padding: 20px 18px; }
    .hero-title h1 { font-size: 24px; }
    .metrics { grid-template-columns: 1fr; }
    .metric-value { font-size: 26px; }
    .trend-grid, .insight-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="page">
    <section class="hero">
        <div class="hero-top">
            <div class="hero-title">
                <h1>拼豆豆数据日报看板</h1>
                <p>把完整日报 `dailyDiagnosis` 展成会议可读看板，统一查看核心指标、首关/教程漏斗、前20关、主线卡点、高重试关卡、广告表现和数据质量。</p>
            </div>
            <div class="hero-controls">
                <select id="dateSelect"></select>
                <input id="dateInput" type="date">
                <button id="loadBtn" type="button">加载日报</button>
                <button id="latestBtn" class="secondary" type="button">最新一天</button>
            </div>
        </div>
        <div class="hero-meta">
            <div class="pill" id="heroDate">日期：-</div>
            <div class="pill" id="heroEnv">环境：-</div>
            <div class="pill" id="heroPath">目录：artifacts/cloudbase-daily-report</div>
        </div>
    </section>

    <div id="content" class="grid">
        <div class="card span-12">
            <div class="loading">正在查找可用日报...</div>
        </div>
    </div>
</div>

<script>
const REPORT_ROOT = '../artifacts/cloudbase-daily-report';

const state = {
    availableDates: [],
    latestDate: '',
    currentDate: '',
    summary: null,
    trendSummaries: [],
};

function qs(id) {
    return document.getElementById(id);
}

function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function pctFromRatio(value, digits = 1) {
    return `${((Number(value) || 0) * 100).toFixed(digits)}%`;
}

function pctRaw(value, digits = 1) {
    return `${(Number(value) || 0).toFixed(digits)}%`;
}

function formatNumber(value) {
    return new Intl.NumberFormat('zh-CN').format(Number(value) || 0);
}

function formatSeconds(value) {
    const seconds = Number(value) || 0;
    if (seconds < 60) return `${seconds.toFixed(0)}s`;
    return `${(seconds / 60).toFixed(1)}m`;
}

function getCollectionSummary(summary, name) {
    return summary?.collections?.[name]?.summary || null;
}

function getDiagnosis(summary) {
    return summary?.dailyDiagnosis || null;
}

function finiteNumber(value, fallback = 0) {
    const number = Number(value);
    return Number.isFinite(number) ? number : fallback;
}

function firstFiniteNumber(...values) {
    for (const value of values) {
        const number = Number(value);
        if (Number.isFinite(number)) {
            return number;
        }
    }
    return 0;
}

function getEffectiveDailyCore(summary) {
    if (summary?.effectiveDailyCore) {
        return summary.effectiveDailyCore;
    }

    const dailyStat = getCollectionSummary(summary, 'daily_stat');
    if (dailyStat && Number(dailyStat.totalRecords) > 0) {
        return {
            source: 'daily_stat',
            isFallback: false,
            ...dailyStat.latest,
        };
    }

    const behavior = getCollectionSummary(summary, 'user_behavior');
    if (behavior) {
        return {
            source: 'user_behavior_fallback',
            isFallback: true,
            date: summary?.date || '',
            dau: Number(behavior.uniqueUsers) || 0,
            newUser: null,
            totalPlay: Number(behavior?.eventCounts?.game_start) || 0,
            retain1: null,
            retain3: null,
            retain7: null,
        };
    }

    return {
        source: 'empty',
        isFallback: true,
        date: summary?.date || '',
        dau: 0,
        newUser: null,
        totalPlay: 0,
        retain1: null,
        retain3: null,
        retain7: null,
    };
}

function getEffectiveAdStat(summary) {
    if (summary?.effectiveAdStat) {
        return summary.effectiveAdStat;
    }

    const adStat = getCollectionSummary(summary, 'ad_stat');
    if (adStat && Number(adStat.totalRecords) > 0) {
        return {
            source: 'ad_stat',
            isFallback: false,
            ...adStat,
        };
    }

    const behavior = getCollectionSummary(summary, 'user_behavior');
    const totalShowNum = Number(behavior?.eventCounts?.ad_show) || 0;
    const totalClickNum = Number(behavior?.eventCounts?.ad_click) || 0;
    const totalFinishNum = Number(behavior?.eventCounts?.ad_finish) || 0;
    const clickRate = totalShowNum ? totalClickNum / totalShowNum : 0;
    const finishRate = totalShowNum ? totalFinishNum / totalShowNum : 0;
    const finishPerClickRate = totalClickNum ? totalFinishNum / totalClickNum : 0;
    const breakdownRows = Array.isArray(behavior?.adEventBreakdown) ? behavior.adEventBreakdown : [];
    const aggregateRow = {
        adType: 'user_behavior_fallback',
        page: 'all',
        label: '全部广告位',
        date: summary?.date || '',
        showNum: totalShowNum,
        clickNum: totalClickNum,
        finishNum: totalFinishNum,
        userNum: Number(behavior?.adUsers) || 0,
        clickRate,
        finishRate,
        finishPerClickRate,
    };

    return {
        source: 'user_behavior_fallback',
        isFallback: true,
        date: summary?.date || '',
        totalRecords: totalShowNum > 0 ? 1 : 0,
        adTypeCount: totalShowNum > 0 ? 1 : 0,
        totalShowNum,
        totalClickNum,
        totalFinishNum,
        totalUserNum: Number(behavior?.adUsers) || 0,
        clickRate,
        finishRate,
        finishPerClickRate,
        topByShow: breakdownRows.length ? breakdownRows : (totalShowNum > 0 ? [aggregateRow] : []),
        weakFinishRate: breakdownRows.length
            ? [...breakdownRows]
                .filter((row) => Number(row.showNum) > 0)
                .sort((a, b) => {
                    if (a.finishRate !== b.finishRate) return a.finishRate - b.finishRate;
                    return b.showNum - a.showNum;
                })
                .slice(0, 10)
            : (totalShowNum > 0 ? [aggregateRow] : []),
    };
}

function basenameOfPath(value) {
    if (!value) return '';
    const normalized = String(value).replace(/\\/g, '/');
    const parts = normalized.split('/');
    return parts[parts.length - 1] || '';
}

function buildBehaviorExportUrl(summary) {
    const fileName = basenameOfPath(summary?.collections?.user_behavior?.exportInfo?.localPath);
    if (!fileName) return '';
    return `${REPORT_ROOT}/${summary.date}/user_behavior/${fileName}`;
}

function buildAdBreakdownFromRecords(records, summary) {
    const stats = new Map();

    for (const record of records) {
        const eventName = record?.eventName || '';
        if (!['ad_show', 'ad_click', 'ad_finish'].includes(eventName)) continue;
        const adType = typeof record?.adType === 'string' && record.adType.trim() ? record.adType.trim() : 'unknown';
        const page = typeof record?.page === 'string' && record.page.trim() ? record.page.trim() : 'unknown';
        const label = page && page !== 'unknown'
            ? (adType.includes(`:${page}`) ? page : `${adType} · ${page}`)
            : adType;
        const key = `${adType}|${page}`;
        if (!stats.has(key)) {
            stats.set(key, {
                adType,
                page,
                label,
                showNum: 0,
                clickNum: 0,
                finishNum: 0,
                userSet: new Set(),
            });
        }
        const item = stats.get(key);
        if (eventName === 'ad_show') item.showNum += 1;
        if (eventName === 'ad_click') item.clickNum += 1;
        if (eventName === 'ad_finish') item.finishNum += 1;
        if (record?.openid) item.userSet.add(record.openid);
    }

    const rows = [...stats.values()].map((item) => ({
        adType: item.adType,
        page: item.page,
        label: item.label,
        showNum: item.showNum,
        clickNum: item.clickNum,
        finishNum: item.finishNum,
        userNum: item.userSet.size,
        clickRate: item.showNum ? Number((item.clickNum / item.showNum).toFixed(4)) : 0,
        finishRate: item.showNum ? Number((item.finishNum / item.showNum).toFixed(4)) : 0,
        finishPerClickRate: item.clickNum ? Number((item.finishNum / item.clickNum).toFixed(4)) : 0,
    })).sort((a, b) => {
        if (b.showNum !== a.showNum) return b.showNum - a.showNum;
        return String(a.label).localeCompare(String(b.label), 'zh-CN');
    });

    const totalShowNum = rows.reduce((sum, row) => sum + Number(row.showNum || 0), 0);
    const totalClickNum = rows.reduce((sum, row) => sum + Number(row.clickNum || 0), 0);
    const totalFinishNum = rows.reduce((sum, row) => sum + Number(row.finishNum || 0), 0);
    const totalUserNum = rows.reduce((sum, row) => sum + Number(row.userNum || 0), 0);

    summary.effectiveAdStat = {
        source: 'user_behavior_detail_fallback',
        isFallback: true,
        date: summary?.date || '',
        totalRecords: rows.length,
        adTypeCount: rows.length,
        totalShowNum,
        totalClickNum,
        totalFinishNum,
        totalUserNum,
        clickRate: totalShowNum ? Number((totalClickNum / totalShowNum).toFixed(4)) : 0,
        finishRate: totalShowNum ? Number((totalFinishNum / totalShowNum).toFixed(4)) : 0,
        finishPerClickRate: totalClickNum ? Number((totalFinishNum / totalClickNum).toFixed(4)) : 0,
        topByShow: rows,
        weakFinishRate: [...rows]
            .filter((row) => Number(row.showNum) > 0)
            .sort((a, b) => {
                if (a.finishRate !== b.finishRate) return a.finishRate - b.finishRate;
                return b.showNum - a.showNum;
            })
            .slice(0, 10),
    };
}

function getAdDisplayLabel(row) {
    if (row && typeof row.label === 'string' && row.label.trim()) {
        return row.label.trim();
    }
    if (row && typeof row.page === 'string' && row.page.trim() && row.page !== 'all') {
        return row.page.trim();
    }
    if (row && typeof row.adType === 'string' && row.adType.trim()) {
        return row.adType.trim();
    }
    return 'unknown';
}

async function enrichAdFallbackFromBehavior(summary) {
    const adStat = getEffectiveAdStat(summary);
    if (!adStat?.isFallback) {
        return;
    }
    if (Array.isArray(adStat.topByShow) && adStat.topByShow.length > 1) {
        return;
    }

    const exportUrl = buildBehaviorExportUrl(summary);
    if (!exportUrl) {
        return;
    }

    try {
        const response = await fetch(exportUrl, { cache: 'no-store' });
        if (!response.ok) {
            return;
        }
        const text = await response.text();
        const records = text
            .split(/\r?\n/)
            .filter(Boolean)
            .map((line) => JSON.parse(line));
        buildAdBreakdownFromRecords(records, summary);
    } catch (_) {
        // Keep aggregate fallback if raw behavior fetch fails.
    }
}

function formatSignedPercent(delta, digits = 1) {
    const value = Number(delta) || 0;
    const prefix = value > 0 ? '+' : '';
    return `${prefix}${value.toFixed(digits)}%`;
}

function formatSignedNumber(delta, digits = 0) {
    const value = Number(delta) || 0;
    const prefix = value > 0 ? '+' : '';
    return `${prefix}${value.toFixed(digits)}`;
}

function getParamDate() {
    const params = new URLSearchParams(window.location.search);
    return params.get('date') || '';
}

function setParamDate(date) {
    const params = new URLSearchParams(window.location.search);
    if (date) {
        params.set('date', date);
    } else {
        params.delete('date');
    }
    const next = `${window.location.pathname}?${params.toString()}`;
    window.history.replaceState({}, '', next);
}

function renderLoading(message) {
    qs('content').innerHTML = `
        <div class="card span-12">
            <div class="loading">${escapeHtml(message)}</div>
        </div>
    `;
}

function renderError(message) {
    qs('content').innerHTML = `
        <div class="card span-12">
            <div class="error">${escapeHtml(message)}</div>
        </div>
    `;
}

function renderMetricCard(label, value, footnote) {
    return `
        <div class="metric">
            <div class="metric-label">${escapeHtml(label)}</div>
            <div class="metric-value">${escapeHtml(value)}</div>
            <div class="metric-footnote">${escapeHtml(footnote || '')}</div>
        </div>
    `;
}

function renderBulletList(items) {
    if (!items || !items.length) {

}

function buildTrendSvg(points, color) {
    if (!points.length) {
        return '<div class="empty">暂无趋势数据。</div>';
    }

    const width = 320;
    const height = 100;
    const padX = 8;
    const padTop = 10;
    const padBottom = 18;
    const values = points.map((point) => Number(point.value) || 0);
    const min = Math.min(...values);
    const max = Math.max(...values);
    const spread = max - min || 1;

    const path = points.map((point, index) => {
        const x = padX + (points.length === 1 ? width / 2 : ((width - padX * 2) * index) / (points.length - 1));
        const y = padTop + ((max - (Number(point.value) || 0)) / spread) * (height - padTop - padBottom);
        return `${index === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
    }).join(' ');

    const circles = points.map((point, index) => {
        const x = padX + (points.length === 1 ? width / 2 : ((width - padX * 2) * index) / (points.length - 1));
        const y = padTop + ((max - (Number(point.value) || 0)) / spread) * (height - padTop - padBottom);
        return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${color}" stroke="#fff" stroke-width="1.5"></circle>`;
    }).join('');

    const baselineY = height - padBottom;
    return `
        <svg class="trend-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true">
            <line x1="${padX}" y1="${baselineY}" x2="${width - padX}" y2="${baselineY}" stroke="rgba(164,150,132,.34)" stroke-width="1"></line>
            <path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
            ${circles}
            <text x="${padX}" y="${height - 2}" class="trend-axis">${escapeHtml(points[0].date.slice(5))}</text>
            <text x="${width - padX}" y="${height - 2}" text-anchor="end" class="trend-axis">${escapeHtml(points[points.length - 1].date.slice(5))}</text>
        </svg>
    `;
}

function parseSortValue(text) {
    const raw = String(text || '').replace(/\s+/g, ' ').trim();
    if (!raw || raw === '-' || raw.toUpperCase() === 'N/A') {
        return { kind: 'empty', text: raw, number: 0 };
    }

    const compact = raw.replace(/,/g, '');
    const duration = compact.match(/^(-?\d+(?:\.\d+)?)\s*([sm])$/i);
    if (duration) {
        const value = Number(duration[1]);
        return {
            kind: 'number',
            text: raw,
            number: duration[2].toLowerCase() === 'm' ? value * 60 : value,
        };
    }

    const percent = compact.match(/^(-?\d+(?:\.\d+)?)%$/);
    if (percent) {
        return { kind: 'number', text: raw, number: Number(percent[1]) };
    }

    const level = compact.match(/^L\s*(-?\d+(?:\.\d+)?)$/i);
    if (level) {
        return { kind: 'number', text: raw, number: Number(level[1]) };
    }

    if (/^-?\d+(?:\.\d+)?$/.test(compact)) {
        return { kind: 'number', text: raw, number: Number(compact) };
    }

    return { kind: 'text', text: raw, number: 0 };
}

function compareSortValues(left, right, direction) {
    if (left.kind === 'empty' && right.kind !== 'empty') return 1;
    if (right.kind === 'empty' && left.kind !== 'empty') return -1;

    let result = 0;
    if (left.kind === 'number' && right.kind === 'number') {
        result = left.number - right.number;
    } else {
        result = left.text.localeCompare(right.text, 'zh-CN', {
            numeric: true,
            sensitivity: 'base',
        });
    }
    return direction === 'descending' ? -result : result;
}

function sortTableByColumn(table, columnIndex, direction) {
    const tbody = table.querySelector('tbody');
    const rows = Array.from(tbody.querySelectorAll('tr'));
    const sorted = rows.map((row) => {
        const cell = row.children[columnIndex];
        return {
            row,
            value: parseSortValue(cell?.innerText || cell?.textContent || ''),
            originalIndex: Number(row.dataset.sortOriginalIndex) || 0,
        };
    }).sort((left, right) => {
        const result = compareSortValues(left.value, right.value, direction);
        if (result !== 0) return result;
        return left.originalIndex - right.originalIndex;
    });

    for (const item of sorted) {
        tbody.appendChild(item.row);
    }

    for (const header of table.querySelectorAll('th')) {
        header.setAttribute('aria-sort', 'none');
    }
    table.querySelectorAll('th')[columnIndex]?.setAttribute('aria-sort', direction);
}

function handleSortableTableClick(event) {
    const button = event.target.closest('.sort-header');
    if (!button) return;
    const table = button.closest('table.sortable-table');
    const header = button.closest('th');
    if (!table || !header) return;

    const columnIndex = Number(button.dataset.sortIndex);
    const currentSort = header.getAttribute('aria-sort');
    const nextSort = currentSort === 'ascending' ? 'descending' : 'ascending';
    sortTableByColumn(table, columnIndex, nextSort);
}

function buildTrendSeries(summaries) {
    return summaries.map((summary) => {
        const diagnosis = getDiagnosis(summary);
        const core = diagnosis?.coreMetrics || {};
        const behavior = getCollectionSummary(summary, 'user_behavior');
        const adStat = getEffectiveAdStat(summary);
        const dailyCore = getEffectiveDailyCore(summary);
        const funnelRows = Array.isArray(diagnosis?.firstLevelFunnel) ? diagnosis.firstLevelFunnel : [];
        const uiReady = funnelRows.find((row) => row.eventName === 'first_level_ui_ready');
        const anyTouch = funnelRows.find((row) => row.eventName === 'first_level_any_touch');
        const fallbackAnyTouchRate = uiReady?.sessions ? finiteNumber(anyTouch?.sessions) / finiteNumber(uiReady.sessions) : undefined;
        const adOverall = diagnosis?.adPerformance?.overall || {};
        return {
            date: summary.date,
            dau: firstFiniteNumber(core.dau, dailyCore?.dau),
            newUser: finiteNumber(dailyCore?.newUser),
            totalPlay: firstFiniteNumber(core.totalPlay, dailyCore?.totalPlay),
            levelOnePassRate: firstFiniteNumber(core.l1UvPassRate, behavior?.levelOneUvPassRate),
            firstTouchRate: firstFiniteNumber(core.firstLevelAnyTouchRate, fallbackAnyTouchRate),
            adFinishRate: firstFiniteNumber(core.adFinishRate, adOverall.finishRate, adStat?.finishRate),
            dailyCoreSource: diagnosis?.dataQuality?.dailyCoreSource || dailyCore?.source || 'empty',
            dailyCoreFallback: diagnosis ? diagnosis?.dataQuality?.dailyCoreSource !== 'daily_stat' : !!dailyCore?.isFallback,
            adSource: diagnosis?.adPerformance?.source || adStat?.source || 'empty',
            adFallback: diagnosis ? !!diagnosis?.adPerformance?.isFallback : !!adStat?.isFallback,
        };
    });
}

function classifyDelta(current, previous, higherIsBetter = true) {
    const currentValue = Number(current) || 0;
    const previousValue = Number(previous) || 0;
    const delta = currentValue - previousValue;
    if (Math.abs(delta) < 0.0001) {
        return { delta, state: 'flat' };
    }
    const positiveState = higherIsBetter ? 'up' : 'down';
    const negativeState = higherIsBetter ? 'down' : 'up';
    return { delta, state: delta > 0 ? positiveState : negativeState };
}

function buildOpsInsights(summary, trendSummaries) {
    const diagnosis = getDiagnosis(summary);
    const trendSeries = buildTrendSeries(trendSummaries);
    const current = trendSeries[trendSeries.length - 1] || {};
    const previous = trendSeries.length > 1 ? trendSeries[trendSeries.length - 2] : null;
    const highlights = [];
    const risks = [];
    const actions = [];

    if (previous) {
        highlights.push(`DAU ${formatSignedNumber(current.dau - previous.dau)}，当前 ${formatNumber(current.dau)}。`);
        highlights.push(`首关漏斗UV通过率较昨日 ${formatSignedPercent((current.levelOnePassRate - previous.levelOnePassRate) * 100)}，当前 ${pctFromRatio(current.levelOnePassRate)}。`);
        highlights.push(`UI ready 后任意首触达较昨日 ${formatSignedPercent((current.firstTouchRate - previous.firstTouchRate) * 100)}，当前 ${pctFromRatio(current.firstTouchRate)}。`);
        highlights.push(`广告完成率较昨日 ${formatSignedPercent((current.adFinishRate - previous.adFinishRate) * 100)}，当前 ${pctFromRatio(current.adFinishRate)}。`);
    } else {
        highlights.push('这是当前目录下第一份可用日报，今天先把它当作基线。');
    }

    if (diagnosis) {
        for (const item of diagnosis.recommendations || []) {
            risks.push(`${item.priority} ${item.topic}：${item.finding}`);
            actions.push(`${item.priority} ${item.topic}：${item.action}`);
        }
        for (const warning of diagnosis.dataQuality?.warnings || []) {
            risks.push(`数据质量：${warning}`);
        }
        return { highlights, risks, actions };
    }

    const behavior = getCollectionSummary(summary, 'user_behavior');
    const levelRecord = getCollectionSummary(summary, 'level_record');
    const adStat = getEffectiveAdStat(summary);
    if (behavior?.lowPassLevels?.length) {
        const top = behavior.lowPassLevels[0];
        risks.push(`主线最明显卡点仍在 L${top.levelId}，UV 通过率只有 ${pctFromRatio(top.uvPassRate)}。`);
        actions.push(`今天优先复盘 L${top.levelId} 的难度和引导。`);
    }
    if (levelRecord?.topRetryLevels?.length) {
        const retry = levelRecord.topRetryLevels[0];
        risks.push(`L${retry.levelId} 平均尝试 ${Number(retry.avgTryCount || 0).toFixed(2)} 次。`);
        actions.push('把高重试关卡的形状、颜色组合和容错逻辑单独拉出来复盘。');
    }
    if (adStat?.weakFinishRate?.length) {
        const weak = adStat.weakFinishRate[0];
        risks.push(`${getAdDisplayLabel(weak)} 广告完成率只有 ${pctFromRatio(weak.finishRate)}。`);
        actions.push('把完成率最低的广告位先减压，回看触发时机和奖励承诺。');
    }
    return { highlights, risks, actions };
}

function describeTutorialTapKey(key) {
    const parts = String(key || '').split('|');
    const touchTarget = parts.length > 1 ? parts[parts.length - 1] : 'unknown';
    const result = parts.length > 1 ? parts[parts.length - 2] : parts[0];
    const step = parts.length > 2 ? parts.slice(0, -2).join('|') : '';
    const resultText = {
        success: '教程判定成功',
        miss_wrong_block: '点了非目标豆子',
        miss_empty: '点空白',
        miss_wrong_slot: '点了非目标槽位',
        ignored_not_ready: '步骤未 ready，被忽略',
        modal_consumed: '弹窗/遮罩消费点击',
        ignored_invalid_step: '步骤无效，被忽略',
        unknown: '未知结果',
    }[result] || `结果 ${result}`;
    const targetText = {
        board: '棋盘区域',
        slot: '下方槽位',
        empty: '空白区域',
        modal: '弹窗/遮罩',
        unknown: '未知位置',
    }[touchTarget] || touchTarget;
    const prefix = step ? `步骤 ${step}：` : '';
    return `${prefix}${resultText}（${targetText}）`;
}

                points: trendSeries.map((item) => ({ date: item.date, value: item.firstTouchRate * 100 })),
                color: '#8c61c8',
                deltaFormatter: (delta) => formatSignedPercent(delta * 100),
            },
            {
                title: '广告完成率',
                value: pctFromRatio(currentTrend.adFinishRate),
                delta: previousTrend ? classifyDelta(currentTrend.adFinishRate, previousTrend.adFinishRate, true) : { state: 'flat', delta: 0 },
                subtitle: currentTrend.adFallback ? '由 user_behavior 回推' : 'ad_stat',
                points: trendSeries.map((item) => ({ date: item.date, value: item.adFinishRate * 100 })),
                color: '#47a96e',
                deltaFormatter: (delta) => formatSignedPercent(delta * 100),
            },
        ].map((item) => renderTrendCard({
            title: item.title,
            value: item.value,
            deltaText: previousTrend ? item.deltaFormatter(item.delta.delta) : '基线',
            deltaClass: item.delta.state,
            subtitle: item.subtitle,
            points: item.points,
            color: item.color,
        })).join('')
        : '<div class="empty">需要至少 1 份日报才能显示趋势。</div>';

    qs('content').innerHTML = `
        <section class="card span-12">
            <div class="card-body">
                <div class="metrics">${heroMetrics}</div>
            </div>
        </section>

        <section class="card span-12">
            <div class="card-header">
                <div class="card-title">今日核心结论</div>
                <div class="card-subtitle">优先来自 dailyDiagnosis.recommendations；没有新结构时才退回旧 summary 推断。</div>
            </div>

                <div class="insight-grid">
                    <div class="insight-box">
                        <h3>趋势变化</h3>
                        ${renderBulletList(insights.highlights)}
                    </div>
                    <div class="insight-box">
                        <h3>风险信号</h3>
                        ${renderBulletList(insights.risks)}
                    </div>
                    <div class="insight-box">
                        <h3>建议动作</h3>
                        ${renderBulletList(insights.actions)}
                    </div>
                </div>
            </div>
        </section>

        <section class="card span-12">
            <div class="card-header">
                <div class="card-title">最近 7 天趋势</div>
                <div class="card-subtitle">使用每份 combined_summary.json 的 dailyDiagnosis 口径；旧日报自动兼容旧字段。</div>
            </div>
            <div class="card-body">
                <div class="trend-grid">${trendCards}</div>
            </div>
        </section>

        <section class="card span-12">
            <div class="card-header">
                <div class="card-title">首关/教程漏斗</div>
                <div class="card-subtitle">同时展示 UV 和 Session，占比统一以 App启动为起点；顶层首关漏斗通过率与本表 L1通过 行使用同一口径。</div>
            </div>
            <div class="card-body">
                ${funnelRows.length ? renderDiagnosisFunnelTable(funnelRows) : '<div class="empty">这份日报没有 first_level_funnel 漏斗数据。</div>'}
            </div>
        </section>

        <section class="card span-12">
            <div class="card-header">
                <div class="card-title">教程点击结果分布</div>
                <div class="card-subtitle">分母是所有 tutorial_tap_result.records，适合直接看误点、空点、未 ready 和成功点击的 PV 构成。</div>
            </div>
            <div class="card-body two-col">
                <div>
                    <div class="card-subtitle" style="margin-bottom:10px;">整体类型</div>
                    ${tutorialTapBreakdown.length ? renderTutorialTapTable(tutorialTapBreakdown) : '<div class="empty">没有 tutorial_tap_result 汇总。</div>'}
                </div>
                <div>
                    <div class="card-subtitle" style="margin-bottom:10px;">按步骤 Top</div>
                    ${tutorialTapByStep.length ? renderTutorialTapTable(tutorialTapByStep) : '<div class="empty">没有 tutorial_tap_result 步骤明细。</div>'}
                </div>
            </div>
        </section>

        <section class="card span-12">
            <div class="card-header">
                <div class="card-title">前20关全量表现</div>
                <div class="card-subtitle">前20关必须全列出，便于从上游到下游看 L1、L2 和后续关卡的真实漏洞。</div>
            </div>
            <div class="card-body">
                ${first20Levels.length ? renderFirst20Table(first20Levels) : '<div class="empty">这份日报没有前20关全量表。</div>'}
            </div>
        </section>

        <section class="card span-6">
            <div class="card-header">
                <div class="card-title">主线卡点表</div>
                <div class="card-subtitle">按进入未通过 UV 优先排序，直接定位真实流失规模最大的关卡。</div>

        <section class="card span-6">

                <div class="card-subtitle">仅保留平均尝试大于 1 且记录数足够的关卡，避免 L1/L2 这类 1.00 行污染判断。</div>
            </div>
            <div class="card-body">

        <section class="card span-6">

                <div class="card-title">数据质量与日志覆盖</div>
                <div class="card-subtitle">把 fallback、缺表和日志覆盖风险显式列出来，避免把缺数据误判成业务结论。</div>
            </div>
            <div class="card-body">
                ${renderDataQuality(diagnosis?.dataQuality || {})}
            </div>
        </section>

        <section class="card span-12">
            <div class="card-header">
                <div class="card-title">快捷文件入口</div>
                <div class="card-subtitle">原始 JSON、统一 Markdown 报告、各表 Markdown 报告和 CSV 明细都能从这里直接点开。</div>
            </div>
            <div class="card-body">
                <div class="link-row">
                    <a href="${REPORT_ROOT}/${summary.date}/combined_report.md">combined_report.md</a>
                    <a href="${REPORT_ROOT}/${summary.date}/combined_summary.json">combined_summary.json</a>
                    ${collections.user_behavior?.reportFiles?.markdownPath ? `<a href="${REPORT_ROOT}/${summary.date}/user_behavior/report.md">user_behavior 报告</a>` : ''}
                    ${collections.level_record?.reportFiles?.markdownPath ? `<a href="${REPORT_ROOT}/${summary.date}/level_record/report.md">level_record 报告</a>` : ''}
                    ${collections.first_level_funnel?.reportFiles?.markdownPath ? `<a href="${REPORT_ROOT}/${summary.date}/first_level_funnel/report.md">first_level_funnel 报告</a>` : ''}
                    ${collections.ad_stat?.reportFiles?.markdownPath ? `<a href="${REPORT_ROOT}/${summary.date}/ad_stat/report.md">ad_stat 报告</a>` : ''}
                    ${collections.daily_stat?.reportFiles?.markdownPath ? `<a href="${REPORT_ROOT}/${summary.date}/daily_stat/report.md">daily_stat 报告</a>` : ''}

}

async function fetchJson(url) {
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) {
        throw new Error(`请求失败: ${response.status} ${response.statusText}`);
    }
    return await response.json();
}

function populateDateControls() {
    const select = qs('dateSelect');
    const input = qs('dateInput');
    select.innerHTML = '';

    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = state.availableDates.length ? '选择已跑出的日期' : '暂无已跑出日期';
    select.appendChild(placeholder);

    for (const date of [...state.availableDates].reverse()) {
        const option = document.createElement('option');
        option.value = date;
        option.textContent = date;
        if (date === state.currentDate) {
            option.selected = true;
        }
        select.appendChild(option);
    }

    input.value = state.currentDate || '';
}

async function loadAvailableDates() {
    const data = await fetchJson('/api/list-report-dates');
    state.availableDates = Array.isArray(data.dates) ? data.dates : [];
    state.latestDate = data.latestDate || '';
}

async function loadTrendSummaries(date) {
    const currentIndex = state.availableDates.indexOf(date);
    const dates = currentIndex >= 0
        ? state.availableDates.slice(Math.max(0, currentIndex - 6), currentIndex + 1)
        : [date];
    const summaries = await Promise.all(
        dates.map(async (itemDate) => {
            try {
                return await fetchJson(`${REPORT_ROOT}/${itemDate}/combined_summary.json`);
            } catch (_) {
                return null;
            }
        }),
    );
    return summaries.filter(Boolean);
}

async function loadReport(date) {
    if (!date) {
        renderError('先选择一个日报日期。');
        return;
    }
    state.currentDate = date;
    populateDateControls();
    setParamDate(date);
    renderLoading(`正在加载 ${date} 的 combined_summary.json ...`);

    const summaryUrl = `${REPORT_ROOT}/${date}/combined_summary.json`;
    try {
        const [summary, trendSummaries] = await Promise.all([
            fetchJson(summaryUrl),
            loadTrendSummaries(date),
        ]);
        await enrichAdFallbackFromBehavior(summary);
        state.summary = summary;
        state.trendSummaries = trendSummaries;
        renderContent(summary, trendSummaries);
    } catch (error) {
        renderError(`没找到 ${date} 的完整日报。请先执行 \`npm run analytics:daily -- --date ${date}\`，然后刷新页面。`);
    }
}

function bindEvents() {
    qs('content').addEventListener('click', handleSortableTableClick);

    qs('loadBtn').addEventListener('click', () => {
        const selectValue = qs('dateSelect').value;
        const inputValue = qs('dateInput').value;
        loadReport(inputValue || selectValue);
    });

    qs('latestBtn').addEventListener('click', () => {
        if (state.latestDate) {
            loadReport(state.latestDate);
        }
    });

    qs('dateSelect').addEventListener('change', (event) => {
        const value = event.target.value;
        if (value) {
            qs('dateInput').value = value;
        }
    });
}

async function init() {
    bindEvents();
    await loadAvailableDates();

    const initialDate = getParamDate() || state.latestDate || '';
    if (!initialDate) {
        populateDateControls();
        renderError('还没发现任何已生成的日报。先运行 `npm run analytics:daily`，再打开这个页面。');
        return;
    }

    populateDateControls();
    await loadReport(initialDate);
}

init().catch((error) => {
    renderError(`初始化失败：${error.message}`);
});
</script>
