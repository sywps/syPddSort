<style>

<body>
<div class="page">
    <section class="hero">
        <div class="hero-top">
            <div class="hero-title">
                <h1>拼豆豆数据日报看板</h1>
                <p>把完整日报 `dailyDiagnosis` 展成会议可读看板，统一查看核心指标、首关/教程漏斗、前20关、关卡净价值、主线卡点、广告表现和数据质量。</p>
            </div>
            <div class="hero-controls">
                <select id="dateSelect"></select>
                <input id="dateInput" type="date">
                <button id="loadBtn" type="button">加载日报</button>
                <button id="latestBtn" class="secondary" type="button">最新一天</button>
                <a id="retentionLink" class="secondary" href="cloudbase-retention-report.html">查看留存</a>
            </div>
        </div>
        <div class="hero-meta">
            <div class="pill" id="heroDate">日期：-</div>
            <div class="pill" id="heroEnv">环境：-</div>
            <div class="pill" id="heroPath">目录：artifacts/cloudbase-daily-report</div>
        </div>
    </section>

    <div id="content" class="grid">
        <div class="card span-12">
            <div class="loading">正在查找可用日报...</div>
        </div>
    </div>
</div>

<script>
const REPORT_ROOT = '../artifacts/cloudbase-daily-report';

const state = {
    availableDates: [],
    latestDate: '',
    currentDate: '',
    summary: null,
    trendSummaries: [],
    showAllFunnelLevels: false,
    showFunnelLatency: false,
    showAllLevelNetValue: false,
    showAllLevelAdRelationship: false,
};

let floatingHeaderElement = null;
let floatingHeaderUpdateFrame = 0;
let floatingHeaderSourceTable = null;

function qs(id) {
    return document.getElementById(id);
}

function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function pctFromRatio(value, digits = 1) {
    return `${((Number(value) || 0) * 100).toFixed(digits)}%`;
}

function pctRaw(value, digits = 1) {
    return `${(Number(value) || 0).toFixed(digits)}%`;
}

function formatNumber(value) {
    return new Intl.NumberFormat('zh-CN').format(Number(value) || 0);
}

function formatSeconds(value) {
    const seconds = finiteNumber(value);
    const text = seconds.toFixed(2).replace(/\.?0+$/, '');
    return `${text}s`;
}

function formatSecondsNumber(value) {
    return finiteNumber(value).toFixed(2).replace(/\.?0+$/, '');
}

function formatMilliseconds(value) {
    const ms = Number(value);
    if (!Number.isFinite(ms) || ms < 0) return '-';
    return `${Math.round(ms)}ms`;
}

function getCollectionSummary(summary, name) {
    return summary?.collections?.[name]?.summary || null;
}

function getDiagnosis(summary) {
    return summary?.dailyDiagnosis || null;
}

function finiteNumber(value, fallback = 0) {
    const number = Number(value);
    return Number.isFinite(number) ? number : fallback;
}

function ratioText(numerator, denominator) {
    const base = finiteNumber(denominator);
    if (base <= 0) return '-';
    return pctFromRatio(finiteNumber(numerator) / base);
}

function perUserText(numerator, denominator) {
    const base = finiteNumber(denominator);
    if (base <= 0) return '-';
    return (finiteNumber(numerator) / base).toFixed(2);
}

function firstFiniteNumber(...values) {
    for (const value of values) {
        const number = Number(value);
        if (Number.isFinite(number)) {
            return number;
        }
    }
    return 0;
}

function getEffectiveDailyCore(summary) {
    if (summary?.effectiveDailyCore) {
        return summary.effectiveDailyCore;
    }

    const dailyStat = getCollectionSummary(summary, 'daily_stat');
    if (dailyStat && Number(dailyStat.totalRecords) > 0) {
        return {
            source: 'daily_stat',
            isFallback: false,
            ...dailyStat.latest,
        };
    }

    const behavior = getCollectionSummary(summary, 'user_behavior');
    if (behavior) {
        return {
            source: 'user_behavior_fallback',
            isFallback: true,
            date: summary?.date || '',
            dau: Number(behavior.uniqueUsers) || 0,
            newUser: null,
            totalPlay: Number(behavior?.eventCounts?.game_start) || 0,
            retain1: null,
            retain3: null,
            retain7: null,
        };
    }

    return {
        source: 'empty',
        isFallback: true,
        date: summary?.date || '',
        dau: 0,
        newUser: null,
        totalPlay: 0,
        retain1: null,
        retain3: null,
        retain7: null,
    };
}

function getEffectiveAdStat(summary) {
    if (summary?.effectiveAdStat) {
        return summary.effectiveAdStat;
    }

    const adStat = getCollectionSummary(summary, 'ad_stat');
    if (adStat && Number(adStat.totalRecords) > 0) {
        return {
            source: 'ad_stat',
            isFallback: false,
            ...adStat,
        };
    }

    const behavior = getCollectionSummary(summary, 'user_behavior');
    const totalShowNum = Number(behavior?.eventCounts?.ad_show) || 0;
    const totalClickNum = Number(behavior?.eventCounts?.ad_click) || 0;
    const totalFinishNum = Number(behavior?.eventCounts?.ad_finish) || 0;
    const clickRate = totalShowNum ? totalClickNum / totalShowNum : 0;
    const finishRate = totalShowNum ? totalFinishNum / totalShowNum : 0;
    const finishPerClickRate = totalClickNum ? totalFinishNum / totalClickNum : 0;
    const breakdownRows = Array.isArray(behavior?.adEventBreakdown) ? behavior.adEventBreakdown : [];
    const aggregateRow = {
        adType: 'user_behavior_fallback',
        page: 'all',
        label: '全部广告位',
        date: summary?.date || '',
        showNum: totalShowNum,
        clickNum: totalClickNum,
        finishNum: totalFinishNum,
        userNum: Number(behavior?.adUsers) || 0,
        clickRate,
        finishRate,
        finishPerClickRate,
    };

    return {
        source: 'user_behavior_fallback',
        isFallback: true,
        date: summary?.date || '',
        totalRecords: totalShowNum > 0 ? 1 : 0,
        adTypeCount: totalShowNum > 0 ? 1 : 0,
        totalShowNum,
        totalClickNum,
        totalFinishNum,
        totalUserNum: Number(behavior?.adUsers) || 0,
        clickRate,
        finishRate,
        finishPerClickRate,
        topByShow: breakdownRows.length ? breakdownRows : (totalShowNum > 0 ? [aggregateRow] : []),
        weakFinishRate: breakdownRows.length
            ? [...breakdownRows]
                .filter((row) => Number(row.showNum) > 0)
                .sort((a, b) => {
                    if (a.finishRate !== b.finishRate) return a.finishRate - b.finishRate;
                    return b.showNum - a.showNum;
                })
                .slice(0, 10)
            : (totalShowNum > 0 ? [aggregateRow] : []),
    };
}

function basenameOfPath(value) {
    if (!value) return '';
    const normalized = String(value).replace(/\\/g, '/');
    const parts = normalized.split('/');
    return parts[parts.length - 1] || '';
}

function buildBehaviorExportUrl(summary) {
    const fileName = basenameOfPath(summary?.collections?.user_behavior?.exportInfo?.localPath);
    if (!fileName) return '';
    return `${REPORT_ROOT}/${summary.date}/user_behavior/${fileName}`;
}

function buildAdBreakdownFromRecords(records, summary) {
    const stats = new Map();

    for (const record of records) {
        const eventName = record?.eventName || '';
        if (!['ad_show', 'ad_click', 'ad_finish'].includes(eventName)) continue;
        const adType = typeof record?.adType === 'string' && record.adType.trim() ? record.adType.trim() : 'unknown';
        const page = typeof record?.page === 'string' && record.page.trim() ? record.page.trim() : 'unknown';
        const label = page && page !== 'unknown'
            ? (adType.includes(`:${page}`) ? page : `${adType} · ${page}`)
            : adType;
        const key = `${adType}|${page}`;
        if (!stats.has(key)) {
            stats.set(key, {
                adType,
                page,
                label,
                showNum: 0,
                clickNum: 0,
                finishNum: 0,
                userSet: new Set(),
            });
        }
        const item = stats.get(key);
        if (eventName === 'ad_show') item.showNum += 1;
        if (eventName === 'ad_click') item.clickNum += 1;
        if (eventName === 'ad_finish') item.finishNum += 1;
        if (record?.openid) item.userSet.add(record.openid);
    }

    const rows = [...stats.values()].map((item) => ({
        adType: item.adType,
        page: item.page,
        label: item.label,
        showNum: item.showNum,
        clickNum: item.clickNum,
        finishNum: item.finishNum,
        userNum: item.userSet.size,
        clickRate: item.showNum ? Number((item.clickNum / item.showNum).toFixed(4)) : 0,
        finishRate: item.showNum ? Number((item.finishNum / item.showNum).toFixed(4)) : 0,
        finishPerClickRate: item.clickNum ? Number((item.finishNum / item.clickNum).toFixed(4)) : 0,
    })).sort((a, b) => {
        if (b.showNum !== a.showNum) return b.showNum - a.showNum;
        return String(a.label).localeCompare(String(b.label), 'zh-CN');
    });

    const totalShowNum = rows.reduce((sum, row) => sum + Number(row.showNum || 0), 0);
    const totalClickNum = rows.reduce((sum, row) => sum + Number(row.clickNum || 0), 0);
    const totalFinishNum = rows.reduce((sum, row) => sum + Number(row.finishNum || 0), 0);
    const totalUserNum = rows.reduce((sum, row) => sum + Number(row.userNum || 0), 0);

    summary.effectiveAdStat = {
        source: 'user_behavior_detail_fallback',
        isFallback: true,
        date: summary?.date || '',
        totalRecords: rows.length,
        adTypeCount: rows.length,
        totalShowNum,
        totalClickNum,
        totalFinishNum,
        totalUserNum,
        clickRate: totalShowNum ? Number((totalClickNum / totalShowNum).toFixed(4)) : 0,
        finishRate: totalShowNum ? Number((totalFinishNum / totalShowNum).toFixed(4)) : 0,
        finishPerClickRate: totalClickNum ? Number((totalFinishNum / totalClickNum).toFixed(4)) : 0,
        topByShow: rows,
        weakFinishRate: [...rows]
            .filter((row) => Number(row.showNum) > 0)
            .sort((a, b) => {
                if (a.finishRate !== b.finishRate) return a.finishRate - b.finishRate;
                return b.showNum - a.showNum;
            })
            .slice(0, 10),
    };
}

function getAdDisplayLabel(row) {
    if (row && typeof row.label === 'string' && row.label.trim()) {
        return row.label.trim();
    }
    if (row && typeof row.page === 'string' && row.page.trim() && row.page !== 'all') {
        return row.page.trim();
    }
    if (row && typeof row.adType === 'string' && row.adType.trim()) {
        return row.adType.trim();
    }
    return 'unknown';
}

async function enrichAdFallbackFromBehavior(summary) {
    const adStat = getEffectiveAdStat(summary);
    if (!adStat?.isFallback) {
        return;
    }
    if (Array.isArray(adStat.topByShow) && adStat.topByShow.length > 1) {
        return;
    }

    const exportUrl = buildBehaviorExportUrl(summary);
    if (!exportUrl) {
        return;
    }

    try {
        const response = await fetch(exportUrl, { cache: 'no-store' });
        if (!response.ok) {
            return;
        }
        const text = await response.text();
        const records = text
            .split(/\r?\n/)
            .filter(Boolean)
            .map((line) => JSON.parse(line));
        buildAdBreakdownFromRecords(records, summary);
    } catch (_) {
        // Keep aggregate fallback if raw behavior fetch fails.
    }
}

function buildTrendSvg(points, color) {
    if (!points.length) {
        return '<div class="empty">暂无趋势数据。</div>';
    }

    const width = 320;
    const height = 100;
    const padX = 8;
    const padTop = 10;
    const padBottom = 18;
    const values = points.map((point) => Number(point.value) || 0);
    const min = Math.min(...values);
    const max = Math.max(...values);
    const spread = max - min || 1;

    const path = points.map((point, index) => {
        const x = padX + (points.length === 1 ? width / 2 : ((width - padX * 2) * index) / (points.length - 1));
        const y = padTop + ((max - (Number(point.value) || 0)) / spread) * (height - padTop - padBottom);
        return `${index === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
    }).join(' ');

    const circles = points.map((point, index) => {
        const x = padX + (points.length === 1 ? width / 2 : ((width - padX * 2) * index) / (points.length - 1));
        const y = padTop + ((max - (Number(point.value) || 0)) / spread) * (height - padTop - padBottom);
        return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${color}" stroke="#fff" stroke-width="1.5"></circle>`;
    }).join('');

    const baselineY = height - padBottom;
    return `
        <svg class="trend-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true">
            <line x1="${padX}" y1="${baselineY}" x2="${width - padX}" y2="${baselineY}" stroke="rgba(164,150,132,.34)" stroke-width="1"></line>
            <path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
            ${circles}
            <text x="${padX}" y="${height - 2}" class="trend-axis">${escapeHtml(points[0].date.slice(5))}</text>
            <text x="${width - padX}" y="${height - 2}" text-anchor="end" class="trend-axis">${escapeHtml(points[points.length - 1].date.slice(5))}</text>
        </svg>
    `;
}

function ensureFloatingTableHeader() {
    if (floatingHeaderElement) {
        return floatingHeaderElement;
    }
    floatingHeaderElement = document.createElement('div');
    floatingHeaderElement.className = 'floating-table-header';
    floatingHeaderElement.addEventListener('click', handleSortableTableClick);
    floatingHeaderElement.addEventListener('click', handleColumnFilterClick);
    floatingHeaderElement.addEventListener('change', handleColumnFilterChange);
    document.body.appendChild(floatingHeaderElement);
    return floatingHeaderElement;
}

function hideFloatingTableHeader() {
    if (!floatingHeaderElement) return;
    floatingHeaderElement.style.display = 'none';
    floatingHeaderElement.innerHTML = '';
    floatingHeaderSourceTable = null;
}

function findActiveTableForFloatingHeader() {
    const content = qs('content');
    if (!content) return null;
    const tables = Array.from(content.querySelectorAll('.table-wrap table.sortable-table'));
    for (const table of tables) {
        const wrap = table.closest('.table-wrap');
        const thead = table.tHead;
        if (!wrap || !thead) continue;

        const tableRect = table.getBoundingClientRect();
        const wrapRect = wrap.getBoundingClientRect();
        const headerRect = thead.getBoundingClientRect();
        const headerHeight = Math.max(1, headerRect.height);
        const visibleTop = Math.max(tableRect.top, wrapRect.top);
        const visibleBottom = Math.min(tableRect.bottom, wrapRect.bottom);

        if (visibleTop <= 0 && visibleBottom > headerHeight + 4) {
            return { table, wrap };
        }
    }
    return null;
}

function syncFloatingTableHeader(table, wrap) {
    const thead = table.tHead;
    if (!thead) {
        hideFloatingTableHeader();
        return;
    }

    const tableRect = table.getBoundingClientRect();
    const wrapRect = wrap.getBoundingClientRect();
    if (wrapRect.width <= 0 || tableRect.width <= 0) {
        hideFloatingTableHeader();
        return;
    }

    const floating = ensureFloatingTableHeader();
    const cloneTable = document.createElement('table');
    cloneTable.className = table.className;
    cloneTable.style.width = `${tableRect.width}px`;
    cloneTable.style.minWidth = '0';
    cloneTable.appendChild(thead.cloneNode(true));
    for (const menu of cloneTable.querySelectorAll('.column-filter-menu')) {
        menu.hidden = true;
    }

    const sourceHeaders = Array.from(thead.querySelectorAll('th'));
    const cloneHeaders = Array.from(cloneTable.querySelectorAll('th'));
    sourceHeaders.forEach((sourceHeader, index) => {
        const cloneHeader = cloneHeaders[index];
        if (!cloneHeader) return;
        const width = sourceHeader.getBoundingClientRect().width;
        if (width > 0) {
            cloneHeader.style.width = `${width}px`;
            cloneHeader.style.minWidth = `${width}px`;
            cloneHeader.style.maxWidth = `${width}px`;
        }
    });

    cloneTable.style.transform = `translateX(${-wrap.scrollLeft}px)`;
    floating.innerHTML = '';
    floating.appendChild(cloneTable);
    floatingHeaderSourceTable = table;
    floating.style.left = `${wrapRect.left}px`;
    floating.style.width = `${wrapRect.width}px`;
    floating.style.display = 'block';
}

function updateFloatingTableHeader() {
    floatingHeaderUpdateFrame = 0;
    const active = findActiveTableForFloatingHeader();
    if (!active) {
        hideFloatingTableHeader();
        return;
    }
    syncFloatingTableHeader(active.table, active.wrap);
}

function scheduleFloatingTableHeaderUpdate() {
    if (floatingHeaderUpdateFrame) return;
    floatingHeaderUpdateFrame = window.requestAnimationFrame(updateFloatingTableHeader);
}

function bindRenderedTableScrollSync() {
    const content = qs('content');
    if (!content) return;
    for (const wrap of content.querySelectorAll('.table-wrap')) {
        wrap.addEventListener('scroll', scheduleFloatingTableHeaderUpdate, { passive: true });
    }
    scheduleFloatingTableHeaderUpdate();
}

function getTableCellText(row, columnIndex) {
    return (row.children[columnIndex]?.innerText || row.children[columnIndex]?.textContent || '')
        .replace(/\s+/g, ' ')
        .trim() || '-';
}

function getFilterableTableRows(table) {
    return Array.from(table.querySelectorAll('tbody tr')).filter((row) => row.dataset.latencyRow !== 'true');
}

function getTableFilterColumns(table) {
    return String(table.dataset.filterColumns || '')
        .split(',')
        .map((item) => Number(item))
        .filter((item) => Number.isInteger(item) && item >= 0);
}

function resolveInteractiveSourceTable(table) {
    if (floatingHeaderElement?.contains(table)) {
        return floatingHeaderSourceTable;
    }
    return table;
}

function closeColumnFilterMenus(exceptMenu = null) {
    for (const menu of document.querySelectorAll('.column-filter-menu')) {
        if (menu !== exceptMenu) menu.hidden = true;
    }
}

function syncColumnFilterMenuState(fromMenu, toMenu) {
    if (!fromMenu || !toMenu) return;
    const sourceInputs = Array.from(fromMenu.querySelectorAll('.column-filter-choice'));
    for (const sourceInput of sourceInputs) {
        const selector = sourceInput.dataset.filterAll === 'true'
            ? '.column-filter-choice[data-filter-all="true"]'
            : `.column-filter-choice[value="${CSS.escape(sourceInput.value)}"]`;
        const targetInput = toMenu.querySelector(selector);
        if (!targetInput) continue;
        targetInput.checked = sourceInput.checked;
        targetInput.indeterminate = sourceInput.indeterminate;
    }
}

function updateColumnFilterButton(table, columnIndex) {
    const menu = table.querySelector(`.column-filter-menu[data-filter-index="${columnIndex}"]`);
    const button = table.querySelector(`.column-filter-button[data-filter-index="${columnIndex}"]`);
    if (!menu || !button) return;
    const options = Array.from(menu.querySelectorAll('.column-filter-choice:not([data-filter-all="true"])'));
    const checked = options.filter((input) => input.checked);
    button.classList.toggle('is-active', checked.length > 0 && checked.length < options.length);
}

function updateColumnFilterAllState(menu) {
    const allInput = menu.querySelector('.column-filter-choice[data-filter-all="true"]');
    const options = Array.from(menu.querySelectorAll('.column-filter-choice:not([data-filter-all="true"])'));
    if (!allInput) return;
    const checkedCount = options.filter((input) => input.checked).length;
    allInput.checked = checkedCount === options.length;
    allInput.indeterminate = checkedCount > 0 && checkedCount < options.length;
}

function applyTableColumnFilters(table, options = {}) {
    const filters = getTableFilterColumns(table)
        .map((columnIndex) => {
            const menu = table.querySelector(`.column-filter-menu[data-filter-index="${columnIndex}"]`);
            const options = Array.from(menu?.querySelectorAll('.column-filter-choice:not([data-filter-all="true"])') || []);
            const selected = new Set(options.filter((input) => input.checked).map((input) => input.value));
            return {
                columnIndex,
                active: selected.size > 0 && selected.size < options.length,
                selected,
            };
        })
        .filter((filter) => filter.selected.size > 0);

    for (const row of getFilterableTableRows(table)) {
        const visible = filters.every((filter) => {
            if (!filter.active) return true;
            return filter.selected.has(getTableCellText(row, filter.columnIndex));
        });
        row.hidden = !visible;
        const latencyRow = row.nextElementSibling;
        if (latencyRow?.dataset?.latencyRow === 'true') {
            latencyRow.hidden = !visible;
        }
    }

    for (const columnIndex of getTableFilterColumns(table)) {
        updateColumnFilterButton(table, columnIndex);
    }
    if (!options.skipFloatingUpdate) {
        scheduleFloatingTableHeaderUpdate();
    }
}

function initializeTableFilters() {
    const content = qs('content');
    if (!content) return;
    for (const table of content.querySelectorAll('table[data-filter-columns]')) {
        const rows = getFilterableTableRows(table);
        for (const columnIndex of getTableFilterColumns(table)) {
            const menu = table.querySelector(`.column-filter-menu[data-filter-index="${columnIndex}"]`);
            if (!menu) continue;
            const values = Array.from(new Set(rows.map((row) => getTableCellText(row, columnIndex))))
                .sort((left, right) => compareSortValues(parseSortValue(left), parseSortValue(right), 'ascending'));
            menu.innerHTML = `
                <label class="column-filter-option">
                    <input class="column-filter-choice" type="checkbox" data-filter-all="true" checked>
                    <span>全部</span>
                </label>
                <div class="column-filter-separator"></div>
                ${values.map((value) => `
                    <label class="column-filter-option">
                        <input class="column-filter-choice" type="checkbox" value="${escapeHtml(value)}" checked>
                        <span>${escapeHtml(value)}</span>
                    </label>
                `).join('')}
            `;
            updateColumnFilterButton(table, columnIndex);
        }
    }
}

function parseSortValue(text) {
    const raw = String(text || '').replace(/\s+/g, ' ').trim();
    if (!raw || raw === '-' || raw.toUpperCase() === 'N/A') {
        return { kind: 'empty', text: raw, number: 0 };
    }

    const compact = raw.replace(/,/g, '');
    const duration = compact.match(/^(-?\d+(?:\.\d+)?)\s*([sm])$/i);
    if (duration) {
        const value = Number(duration[1]);
        return {
            kind: 'number',
            text: raw,
            number: duration[2].toLowerCase() === 'm' ? value * 60 : value,
        };
    }

    const percent = compact.match(/^(-?\d+(?:\.\d+)?)%$/);
    if (percent) {
        return { kind: 'number', text: raw, number: Number(percent[1]) };
    }

    const level = compact.match(/^L\s*(-?\d+(?:\.\d+)?)$/i);
    if (level) {
        return { kind: 'number', text: raw, number: Number(level[1]) };
    }

    if (/^-?\d+(?:\.\d+)?$/.test(compact)) {
        return { kind: 'number', text: raw, number: Number(compact) };
    }

    return { kind: 'text', text: raw, number: 0 };
}

function compareSortValues(left, right, direction) {
    if (left.kind === 'empty' && right.kind !== 'empty') return 1;
    if (right.kind === 'empty' && left.kind !== 'empty') return -1;

    let result = 0;
    if (left.kind === 'number' && right.kind === 'number') {
        result = left.number - right.number;
    } else {
        result = left.text.localeCompare(right.text, 'zh-CN', {
            numeric: true,
            sensitivity: 'base',
        });
    }
    return direction === 'descending' ? -result : result;
}

function sortTableByColumn(table, columnIndex, direction) {
    const tbody = table.querySelector('tbody');
    const rows = Array.from(tbody.querySelectorAll('tr'));
    const groups = [];
    for (const row of rows) {
        if (row.dataset.latencyRow === 'true') {
            continue;
        }
        const groupedRows = [row];
        const latencyRow = row.nextElementSibling;
        if (latencyRow?.dataset?.latencyRow === 'true') {
            groupedRows.push(latencyRow);
        }
        const cell = row.children[columnIndex];
        groups.push({
            row,
            groupedRows,
            value: parseSortValue(cell?.innerText || cell?.textContent || ''),
            originalIndex: Number(row.dataset.sortOriginalIndex) || 0,
        });
    }
    const sorted = groups.sort((left, right) => {
        const result = compareSortValues(left.value, right.value, direction);
        if (result !== 0) return result;
        return left.originalIndex - right.originalIndex;
    });

    for (const item of sorted) {
        for (const row of item.groupedRows) {
            tbody.appendChild(row);
        }
    }

    for (const header of table.querySelectorAll('th')) {
        header.setAttribute('aria-sort', 'none');
    }
    table.querySelectorAll('th')[columnIndex]?.setAttribute('aria-sort', direction);
    scheduleFloatingTableHeaderUpdate();
}

function handleSortableTableClick(event) {
    const button = event.target.closest('.sort-header');
    if (!button) return;
    const rawTable = button.closest('table.sortable-table');
    const table = resolveInteractiveSourceTable(rawTable);
    if (!rawTable || !table) return;

    const columnIndex = Number(button.dataset.sortIndex);
    const header = table.querySelectorAll('th')[columnIndex];
    if (!header) return;
    const currentSort = header.getAttribute('aria-sort');
    const nextSort = currentSort === 'ascending' ? 'descending' : 'ascending';
    sortTableByColumn(table, columnIndex, nextSort);
}

function handleColumnFilterClick(event) {
    const button = event.target.closest('.column-filter-button');
    if (button) {
        const rawTable = button.closest('table.sortable-table');
        const table = resolveInteractiveSourceTable(rawTable);
        const columnIndex = Number(button.dataset.filterIndex);
        const menu = rawTable?.querySelector(`.column-filter-menu[data-filter-index="${columnIndex}"]`);
        const sourceMenu = table?.querySelector(`.column-filter-menu[data-filter-index="${columnIndex}"]`);
        if (!rawTable || !table || !menu) return;
        if (rawTable !== table && sourceMenu) {
            syncColumnFilterMenuState(sourceMenu, menu);
        }
        const shouldOpen = menu.hidden;
        closeColumnFilterMenus(menu);
        menu.hidden = !shouldOpen;
        return;
    }
    if (!event.target.closest('.column-filter-menu')) {
        closeColumnFilterMenus();
    }
}

function handleColumnFilterChange(event) {
    const input = event.target.closest('.column-filter-choice');
    if (!input) return;
    const rawTable = input.closest('table.sortable-table');
    const table = resolveInteractiveSourceTable(rawTable);
    const menu = input.closest('.column-filter-menu');
    if (!rawTable || !table || !menu) return;

    if (input.dataset.filterAll === 'true') {
        for (const option of menu.querySelectorAll('.column-filter-choice:not([data-filter-all="true"])')) {
            option.checked = input.checked;
        }
    } else {
        updateColumnFilterAllState(menu);
    }
    if (rawTable !== table) {
        const columnIndex = Number(menu.dataset.filterIndex);
        const sourceMenu = table.querySelector(`.column-filter-menu[data-filter-index="${columnIndex}"]`);
        syncColumnFilterMenuState(menu, sourceMenu);
        if (sourceMenu) {
            updateColumnFilterAllState(sourceMenu);
        }
        applyTableColumnFilters(table, { skipFloatingUpdate: true });
        updateColumnFilterButton(rawTable, columnIndex);
        return;
    }
    applyTableColumnFilters(table);
}

function buildTrendSeries(summaries) {
    return summaries.map((summary) => {
        const diagnosis = getDiagnosis(summary);
        const core = diagnosis?.coreMetrics || {};
        const behavior = getCollectionSummary(summary, 'user_behavior');
        const adStat = getEffectiveAdStat(summary);
        const dailyCore = getEffectiveDailyCore(summary);
        const funnelRows = Array.isArray(diagnosis?.firstLevelFunnel) ? diagnosis.firstLevelFunnel : [];
        const uiReady = funnelRows.find((row) => row.eventName === 'first_level_ui_ready');
        const anyTouch = funnelRows.find((row) => row.eventName === 'first_level_any_touch');
        const fallbackAnyTouchRate = uiReady?.sessions ? finiteNumber(anyTouch?.sessions) / finiteNumber(uiReady.sessions) : undefined;
        const adOverall = diagnosis?.adPerformance?.overall || {};
        return {
            date: summary.date,
            dau: firstFiniteNumber(core.dau, dailyCore?.dau),
            newUser: finiteNumber(dailyCore?.newUser),
            totalPlay: firstFiniteNumber(core.totalPlay, dailyCore?.totalPlay),
            levelOnePassRate: firstFiniteNumber(core.l1UvPassRate, behavior?.levelOneUvPassRate),
            firstTouchRate: firstFiniteNumber(core.firstLevelAnyTouchRate, fallbackAnyTouchRate),
            adFinishRate: firstFiniteNumber(core.adFinishRate, adOverall.finishRate, adStat?.finishRate),
            dailyCoreSource: diagnosis?.dataQuality?.dailyCoreSource || dailyCore?.source || 'empty',
            dailyCoreFallback: diagnosis ? diagnosis?.dataQuality?.dailyCoreSource !== 'daily_stat' : !!dailyCore?.isFallback,
            adSource: diagnosis?.adPerformance?.source || adStat?.source || 'empty',
            adFallback: diagnosis ? !!diagnosis?.adPerformance?.isFallback : !!adStat?.isFallback,
        };
    });
}

function classifyDelta(current, previous, higherIsBetter = true) {
    const currentValue = Number(current) || 0;
    const previousValue = Number(previous) || 0;
    const delta = currentValue - previousValue;
    if (Math.abs(delta) < 0.0001) {
        return { delta, state: 'flat' };
    }
    const positiveState = higherIsBetter ? 'up' : 'down';
    const negativeState = higherIsBetter ? 'down' : 'up';
    return { delta, state: delta > 0 ? positiveState : negativeState };
}

function buildOpsInsights(summary, trendSummaries) {
    const diagnosis = getDiagnosis(summary);
    const trendSeries = buildTrendSeries(trendSummaries);
    const current = trendSeries[trendSeries.length - 1] || {};
    const previous = trendSeries.length > 1 ? trendSeries[trendSeries.length - 2] : null;
    const highlights = [];
    const risks = [];
    const actions = [];

    if (previous) {
        highlights.push(`DAU ${formatSignedNumber(current.dau - previous.dau)}，当前 ${formatNumber(current.dau)}。`);
        highlights.push(`首关漏斗UV通过率较昨日 ${formatSignedPercent((current.levelOnePassRate - previous.levelOnePassRate) * 100)}，当前 ${pctFromRatio(current.levelOnePassRate)}。`);
        highlights.push(`UI ready 后任意首触达较昨日 ${formatSignedPercent((current.firstTouchRate - previous.firstTouchRate) * 100)}，当前 ${pctFromRatio(current.firstTouchRate)}。`);
        highlights.push(`广告完成率较昨日 ${formatSignedPercent((current.adFinishRate - previous.adFinishRate) * 100)}，当前 ${pctFromRatio(current.adFinishRate)}。`);
    } else {
        highlights.push('这是当前目录下第一份可用日报，今天先把它当作基线。');
    }

    if (diagnosis) {
        for (const item of diagnosis.recommendations || []) {
            risks.push(`${item.priority} ${item.topic}：${item.finding}`);
            actions.push(`${item.priority} ${item.topic}：${item.action}`);
        }
        for (const warning of diagnosis.dataQuality?.warnings || []) {
            risks.push(`数据质量：${warning}`);
        }
        return { highlights, risks, actions };
    }

    const behavior = getCollectionSummary(summary, 'user_behavior');
    const levelRecord = getCollectionSummary(summary, 'level_record');
    const adStat = getEffectiveAdStat(summary);
    if (behavior?.lowPassLevels?.length) {
        const top = behavior.lowPassLevels[0];
        risks.push(`主线最明显卡点仍在 L${top.levelId}，UV 通过率只有 ${pctFromRatio(top.uvPassRate)}。`);
        actions.push(`今天优先复盘 L${top.levelId} 的结构、行为阻力和引导。`);
    }
    if (levelRecord?.topRetryLevels?.length) {
        const retry = levelRecord.topRetryLevels[0];
        risks.push(`L${retry.levelId} 平均尝试 ${Number(retry.avgTryCount || 0).toFixed(2)} 次。`);
        actions.push('把高重试关卡的形状、颜色组合和容错逻辑单独拉出来复盘。');
    }
    if (adStat?.weakFinishRate?.length) {
        const weak = adStat.weakFinishRate[0];
        risks.push(`${getAdDisplayLabel(weak)} 广告完成率只有 ${pctFromRatio(weak.finishRate)}。`);
        actions.push('把完成率最低的广告位先减压，回看触发时机和奖励承诺。');
    }
    return { highlights, risks, actions };
}

    const step = parts.length > 2 ? parts.slice(0, -2).join('|') : '';
    const resultText = {
        success: '教程判定成功',
        miss_wrong_block: '点了非目标豆子',
        miss_empty: '点空白',
        miss_wrong_slot: '点了非目标槽位',

function renderLevelNetValueExplanation(model) {
    const durationSource = escapeHtml(model?.durationBaselineSource || 'level_record.avgDurationSeconds');
    const adSeconds = formatNumber(model?.adSecondsAssumption || 30);
    return `
        <details class="analysis-details">
            <summary>展开看：关卡净价值表到底怎么算、怎么用</summary>
            <div class="analysis-details-body">
                <section>
                    <h4>先说结论</h4>
                    <p>这张表不是为了给关卡贴一个简单的“好”或“不好”标签，而是把玩家体验和广告收益放在同一张表里看。我们真正想找的是三类关卡：玩家卡得难受但广告收益也不高的关卡，要优先降阻力；玩家愿意继续玩、广告也比较健康的关卡，可以保留；广告完成很多但玩家体验明显变差的关卡，要谨慎，不能用流失换广告。</p>
                </section>
                <div class="analysis-columns">
                    <section>
                        <h4>为什么拆成这些列</h4>
                        <ul>
                            <li><strong>结构难度</strong>看关卡文件本身。比如有多少格、多少种颜色、棋盘有多密、时间是否紧。L1/L2 这种 24 格、30 格的小关，就应该显示为简单。</li>
                            <li><strong>行为阻力</strong>看玩家实际表现。通过率低不一定说明关卡本身难，也可能是教程没讲清楚、点击识别不舒服、首屏没准备好，或者玩家还没理解玩法。</li>
                            <li><strong>教程</strong>单独列出来，是为了避免把引导关误判成普通关。教程关如果通过率低，优先查引导和交互，不要先改关卡结构。</li>
                            <li><strong>时长压力</strong>看这一关是否明显太短或太长。太短可能没形成挑战，太长可能消耗耐心。</li>
                        </ul>
                    </section>
                    <section>
                        <h4>几个分数怎么读</h4>
                        <ul>
                            <li><strong>体验分</strong>综合通过率、下关进入、时长、纯流失和重试。分越低，越像玩家在这里不舒服。</li>
                            <li><strong>收入代理</strong>只看广告完成情况。它不是实际收入，因为这里还没有接入 eCPM 和真实广告收益，只能先当作收入强弱的近似信号。</li>
                            <li><strong>广告摩擦</strong>看广告给玩家带来的成本。曝光多、重复曝光多、看完广告还是没过关，都会让这个分变高。</li>
                            <li><strong>净价值</strong>把体验、广告完成和广告摩擦放到一起看。一个关卡广告完成高，但广告摩擦也高，净价值就不会盲目变好。</li>
                        </ul>
                    </section>
                </div>
                <section>
                    <h4>“净时长估算”是什么意思</h4>
                    <p>现在日志里的关卡时长会混进看广告的时间，所以不能直接把平均时长当成关卡本身耗时。这里先用多日时长基线：${durationSource}，再按广告完播次数扣掉一部分广告时间。当前按每次完播约 ${adSeconds} 秒估算。比如某关平均每局看完 0.5 次广告，就从基线里扣大约 15 秒。这个数不是精确的真实无广告时长，它的用途是避免把“玩家在看广告”误判成“关卡本身很长”。</p>
                </section>
                <section>
                    <h4>怎么验证这套表有没有跑偏</h4>
                    <ul>
                        <li>第一，看 L1/L2。它们结构上很简单，如果表里显示结构难度很高，就说明模型错了；现在它们应该是“结构简单”，问题只可能落到教程、点击或首关流程。</li>
                        <li>第二，看 L12、L13、L14 这类大关。它们格子多、颜色多，结构难度应该明显高于 L1/L2。如果广告也集中在这里，就要区分是合理挑战带来的广告，还是过重阻力带来的广告。</li>
                        <li>第三，看样本量。样本低的关卡只能当方向，不能直接下最终结论。表里的“样本”列就是提醒这一点。</li>
                        <li>第四，看动作建议。如果显示“教程阻力”，优先查引导和交互；如果显示“行为阻力”，优先查局部设计和节奏；如果只是“观察”，不要因为单日波动马上改关。</li>
                    </ul>
                </section>
            </div>
        </details>
    `;
}

async function fetchJson(url) {
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) {
        throw new Error(`请求失败: ${response.status} ${response.statusText}`);
    }
    return await response.json();
}

function populateDateControls() {
    const select = qs('dateSelect');
    const input = qs('dateInput');
    select.innerHTML = '';

    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = state.availableDates.length ? '选择已跑出的日期' : '暂无已跑出日期';
    select.appendChild(placeholder);

    for (const date of [...state.availableDates].reverse()) {
        const option = document.createElement('option');
        option.value = date;
        option.textContent = date;
        if (date === state.currentDate) {
            option.selected = true;
        }
        select.appendChild(option);
    }

    input.value = state.currentDate || '';
}

async function loadAvailableDates() {
    const pinnedDate = getParamDate();
    let dates = [];
    let latestDate = '';

    try {
        const data = await fetchJson('/api/list-report-dates');
        dates = Array.isArray(data.dates) ? data.dates : [];
        latestDate = data.latestDate || '';
    } catch (_) {
        dates = await loadAvailableDatesFromStaticListing();
        latestDate = dates[dates.length - 1] || '';
    }

    if (pinnedDate && !dates.includes(pinnedDate)) {
        dates.push(pinnedDate);
        dates.sort();
    }

    state.availableDates = dates;
    state.latestDate = latestDate || dates[dates.length - 1] || pinnedDate || '';
}

async function loadAvailableDatesFromStaticListing() {
    try {
        const response = await fetch(`${REPORT_ROOT}/`, { cache: 'no-store' });
        if (!response.ok) return [];
        const html = await response.text();
        const dates = [];
        for (const match of html.matchAll(/href=["']([^"']+)["']/g)) {
            const href = decodeURIComponent(match[1] || '');
            const date = href.replace(/\/$/, '').split('/').pop();
            if (/^\d{4}-\d{2}-\d{2}$/.test(date)) dates.push(date);
        }
        return Array.from(new Set(dates)).sort();
    } catch (_) {
        return [];
    }
}

async function loadTrendSummaries(date) {
    const currentIndex = state.availableDates.indexOf(date);
    const dates = currentIndex >= 0
        ? state.availableDates.slice(Math.max(0, currentIndex - 6), currentIndex + 1)
        : [date];
    const summaries = await Promise.all(
        dates.map(async (itemDate) => {
            try {
                return await fetchJson(`${REPORT_ROOT}/${itemDate}/combined_summary.json`);
            } catch (_) {
                return null;
            }
        }),
    );
    return summaries.filter(Boolean);
}

async function loadReport(date) {
    if (!date) {
        renderError('先选择一个日报日期。');
        return;
    }
    state.currentDate = date;
    populateDateControls();
    setParamDate(date);
    renderLoading(`正在加载 ${date} 的 combined_summary.json ...`);

    const summaryUrl = `${REPORT_ROOT}/${date}/combined_summary.json`;
    try {
        const [summary, trendSummaries] = await Promise.all([
            fetchJson(summaryUrl),
            loadTrendSummaries(date),
        ]);
        await enrichAdFallbackFromBehavior(summary);
        state.summary = summary;
        state.trendSummaries = trendSummaries;
        renderContent(summary, trendSummaries);
    } catch (error) {
        renderError(`没找到 ${date} 的完整日报。请先执行 \`npm run analytics:daily -- --date ${date}\`，然后刷新页面。`);
    }
}

function bindEvents() {
    qs('content').addEventListener('click', handleSortableTableClick);
    qs('content').addEventListener('click', handleColumnFilterClick);
    qs('content').addEventListener('click', handleSectionExpandClick);
    qs('content').addEventListener('change', handleColumnFilterChange);
    qs('content').addEventListener('change', handleFunnelLatencyToggle);
    qs('content').addEventListener('change', handleFunnelScopeToggle);
    window.addEventListener('scroll', scheduleFloatingTableHeaderUpdate, { passive: true });
    window.addEventListener('resize', scheduleFloatingTableHeaderUpdate);

    qs('loadBtn').addEventListener('click', () => {
        const selectValue = qs('dateSelect').value;
        const inputValue = qs('dateInput').value;
        loadReport(inputValue || selectValue);
    });

    qs('latestBtn').addEventListener('click', () => {
        if (state.latestDate) {
            loadReport(state.latestDate);
        }
    });

    qs('dateSelect').addEventListener('change', (event) => {
        const value = event.target.value;
        if (value) {
            qs('dateInput').value = value;
        }
        updateRetentionLink(value);
    });

    qs('dateInput').addEventListener('change', (event) => {
        updateRetentionLink(event.target.value || qs('dateSelect').value);
    });
}

async function init() {
    bindEvents();
    await loadAvailableDates();

    const initialDate = getParamDate() || state.latestDate || '';
    if (!initialDate) {
        populateDateControls();
        renderError('还没发现任何已生成的日报。先运行 `npm run analytics:daily`，再打开这个页面。');
        return;
    }

    populateDateControls();
    await loadReport(initialDate);
}

init().catch((error) => {
    renderError(`初始化失败：${error.message}`);
});
</script>
