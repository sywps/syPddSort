const COLOR_HEX={"1": "#ED5090", "2": "#4EEAEA", "3": "#F8C811", "4": "#FE8B10", "5": "#F4BD9E", "6": "#EBDEA6", "7": "#4A4DCF", "8": "#7221BC", "9": "#9FCE21", "10": "#CC3827", "11": "#37A92D", "12": "#207955", "13": "#20A8DC", "14": "#EEB2BC", "15": "#C4BED9", "16": "#974714", "17": "#782F3C", "18": "#36387E", "19": "#373737", "20": "#F2EDE4"};
function drawGrid(canvas, grid, cellSize, options = {}) {
    const h = grid.length, w = grid[0].length;
    canvas.width = w * cellSize;
    canvas.height = h * cellSize;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingEnabled = false;

    for (let r = 0; r < h; r++) {
        for (let c = 0; c < w; c++) {
            const v = grid[r][c];
            if (v === 0) continue;
            const hex = options.palette?.[v] || COLOR_HEX[v] || '#ccc';
            const x = c * cellSize, y = r * cellSize;
            const radius = Math.max(0.5, cellSize * 0.14);

            // Fill the full cell so preview scaling does not create white seams.
            ctx.beginPath();
            ctx.roundRect(x, y, cellSize + 0.35, cellSize + 0.35, radius);
            ctx.fillStyle = hex;
            ctx.fill();

            // Subtle highlight
            if (cellSize >= 7) {
                ctx.beginPath();
                ctx.roundRect(x + cellSize * 0.18, y + cellSize * 0.16, cellSize * 0.64, cellSize * 0.24, radius);
                ctx.fillStyle = 'rgba(255,255,255,0.10)';
                ctx.fill();
            }
        }
    }

    if (options.specialMeta) {
        drawSpecialOverlays(ctx, options.specialMeta, w, h, cellSize, options.specialMode || 'card');
    }
}
function radio(group,value,label){const input=document.createElement('input');input.type='radio';input.name='level-'+group.levelId;input.value=value;input.checked=choices[group.levelId]===value;input.setAttribute('aria-label',label);input.addEventListener('change',()=>{choices[group.levelId]=value;persist();update();});return input;}
function render(){
 $('levels').replaceChildren();
 for(const group of data.levels){
  const section=el('section');section.id='level-'+group.levelId;section.dataset.level=group.levelId;
  const row=el('div','row');row.append(el('h2','',`第${group.levelId}关`),el('span','badge'));section.append(row);
  section.append(el('p','',`参考：${group.reference.beans}豆 · ${group.reference.colors}色 · ${group.reference.timeLimit}秒 · 初始容量${group.reference.capacity}`));
  const cards=el('div','cards');
  for(const c of group.candidates){
   const label=el('label','card');const img=el('canvas');img.setAttribute('role','img');img.setAttribute('aria-label',c.id+'候选图案');drawGrid(img,c.previewGrid,10,{palette:c.previewPalette});
   img.addEventListener('error',()=>message('候选图片加载失败：'+c.id+'，请刷新或检查本地预览服务。'));
   const title=el('div','choice-title');title.append(radio(group,c.id,'选择'+c.id),el('span','',c.id));
   label.append(img,title,el('div','meta',`${c.sourceLabel} #${c.sourceLevel}\n${c.beans}豆 / ${c.colors}色 · 豆数${c.delta>0?'+':''}${c.delta.toFixed(1)}%`));cards.append(label);
  }
  section.append(cards);
  if(group.candidates.length<3)section.append(el('p','notice',`本关只有${group.candidates.length}张符合条件的候选；不满意可选择下方选项。`));
  const bottom=el('div','bottom');const none=el('label','none');none.append(radio(group,'none','第'+group.levelId+'关没有满意关卡'),el('span','','没有满意关卡，重新找图'));
  const clear=el('button','clear','取消本关选择');clear.addEventListener('click',()=>{delete choices[group.levelId];section.querySelectorAll('input').forEach(i=>i.checked=false);persist();update();});bottom.append(none,clear);section.append(bottom);$('levels').append(section);
 }
 update();
}
function update(){
 const values=Object.values(choices),none=values.filter(v=>v==='none').length;
 $('progress').textContent=`已处理 ${values.length}/${data.levels.length} · 已选图 ${values.length-none} · 不满意 ${none}`;
 let shown=0;
 for(const section of $('levels').querySelectorAll('section')){
  const choice=choices[section.dataset.level];const filter=$('filter').value;
  const show=filter==='all'||(filter==='pending'&&!choice)||(filter==='none'&&choice==='none')||(filter==='chosen'&&choice&&choice!=='none');
  section.hidden=!show;if(show)shown++;
  section.querySelector('.badge').textContent=choice==='none'?'待重新找图':choice||'未选择';
 }
 let empty=$('empty');if(!empty){empty=el('p','','当前筛选下没有关卡');empty.id='empty';$('levels').append(empty);}empty.hidden=shown>0;
}
function exportData(){return {schemaVersion:1,revision:data.revision,range:[101,200],exportedAt:new Date().toISOString(),choices:{...choices},selections:data.levels.map(g=>({levelId:g.levelId,status:!choices[g.levelId]?'pending':choices[g.levelId]==='none'?'unsatisfied':'selected',candidate:g.candidates.find(c=>c.id===choices[g.levelId])||null,reference:g.reference}))};}
function resultText(){return data.levels.map(g=>{const value=choices[g.levelId];return `${g.levelId} ${!value?'未选择':value==='none'?'没有满意关卡':value.split('-').pop()}`;}).join('\n');}
$('filter').addEventListener('change',update);
for(const group of data.levels){const option=el('option','','第'+group.levelId+'关');option.value=group.levelId;$('jump').append(option);}
$('jump').addEventListener('change',()=>{if(!$('jump').value)return;$('filter').value='all';update();$('level-'+$('jump').value).scrollIntoView({behavior:'smooth'});});
$('copy').addEventListener('click',()=>{
 const text=resultText();$('result').value=text;
 const status=$('result-dialog').querySelector('p');
 status.textContent='结果已显示。如未自动复制，请在下方按 Ctrl+A、Ctrl+C 复制后发给我。';
 $('result-dialog').showModal();$('result').focus();$('result').select();
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(text).then(()=>{status.textContent='已复制成功，可以直接粘贴发给我。';},()=>{status.textContent='浏览器未允许自动复制，请在下方按 Ctrl+A、Ctrl+C 手动复制。';});
 }
});
$('download').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(exportData(),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=el('a');a.href=url;a.download='关卡重选-101-200.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('已生成下载文件，请确认浏览器已保存。');});
$('import').addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',async()=>{const file=$('file').files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(parsed.schemaVersion!==1||parsed.revision!==data.revision)throw Error('候选版本不匹配，未导入');const incoming=valid(parsed.choices);if(Object.keys(choices).length&&!confirm('导入会替换当前页面的选择，是否继续？'))return;choices={...incoming};persist();render();message('导入成功。');}catch(error){message('导入失败：'+error.message);}finally{$('file').value='';}});
$('close-dialog').addEventListener('click',()=>$('result-dialog').close());
render();
</script></body></html>
