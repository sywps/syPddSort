<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新图案 · 3—5关第三版</title>
<style>body{margin:0;background:#f4f1eb;color:#293d36;font:16px/1.65 system-ui}main{max-width:1100px;padding:32px 20px;margin:auto}h1{margin:0;font-size:30px}p{color:#5e6a62}section{background:white;border-radius:20px;padding:24px;margin:24px 0}h2{margin:0}.boards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}figure{margin:0;text-align:center}canvas{width:100%;max-width:300px;background:#f7f5f0;border-radius:12px}figcaption{margin:8px}a{color:#167260}nav{display:flex;flex-wrap:wrap;gap:24px;margin:16px 0}strong{color:#167260}@media(max-width:600px){.boards{grid-template-columns:1fr}main{padding:20px 12px}}</style>
<main><strong>关卡候选 / retention-v3</strong><h1>小柴犬 → 向日葵 → 爱心</h1><p>使用项目初始乱序脚本生成，三关错位率均超过80%。已替换正式第3—5关；旧图案保留用于对照。</p><nav><a href="README.md">设计与验证说明</a><a href="../retention-v2/">对比上一版</a></nav><p>第三关基础容量72，第三关沿用旧开局引导，免费+12后为84；4—5关剩余不超过12格时显示一次扩容气泡。外部试玩没有主线引导，另提供84容量体验入口。若出现 UI Preview，点击「进入 Game.scene」。</p><div id="cards">加载中…</div></main>
<script>
const colors=['transparent','#ED5090','#4EEAEA','#F8C811','#FE8B10','#F4BD9E','#EBDEA6','#4A4DCF','#7221BC','#9FCE21','#EA281A','#37A92D','#207955','#20A8DC','#EEB2BC','#C4BED9','#974714','#782F3C','#36387E','#373737','#F2EDE4'];
async function read(file){const response=await fetch(file);if(!response.ok)throw Error(file+' '+response.status);return response.json()}
function draw(grid,label){const f=document.createElement('figure'),c=document.createElement('canvas'),t=document.createElement('figcaption');c.width=c.height=320;c.setAttribute('aria-label',label);const g=c.getContext('2d'),size=296/Math.max(grid.length,grid[0].length),ox=(320-size*grid[0].length)/2,oy=(320-size*grid.length)/2;grid.forEach((row,r)=>row.forEach((color,col)=>{if(color){g.fillStyle=colors[color];g.fillRect(ox+col*size,oy+r*size,size-.6,size-.6)}}));t.textContent=label;f.append(c,t);return f}
function link(label,file){const a=document.createElement('a');a.textContent=label+' ↗';a.href='http://localhost:7456/?profile=local-test&levelfile='+encodeURIComponent('tools/generated_levels/retention-v3/'+file);a.target='_blank';return a}
async function render(){const manifest=await read('manifest.json'),host=document.getElementById('cards');host.textContent='';for(const item of manifest.levels){const [old,level]=await Promise.all([read('original_'+item.id+'.json'),read('level_'+item.id+'.json')]),s=document.createElement('section'),h=document.createElement('h2'),p=document.createElement('p'),reason=document.createElement('p'),boards=document.createElement('div'),nav=document.createElement('nav');h.textContent='第'+item.id+'关 · '+item.name;p.textContent=item.filled+'颗豆 · '+item.displaced+'颗待归位 · '+item.activeColors+'种待操作颜色 · '+item.time+'秒 · 基础容量'+item.capacity;reason.textContent=item.reason;boards.className='boards';boards.append(draw(old.correctColorArr,'原正式图案'),draw(level.correctColorArr,'新图案'),draw(level.initRandomColorArr,'新开局'));nav.append(link('试玩新版','level_'+item.id+'.json'));if(item.id===3)nav.append(link('体验扩容后84容量','level_3_expanded.json'));const proof=document.createElement('a');proof.href='mainline_solution_'+item.id+'.json';proof.textContent='合法操作参考';nav.append(proof);s.append(h,p,reason,boards,nav);host.append(s)}}render().catch(e=>document.getElementById('cards').textContent='加载失败：'+e.message);
</script></html>
