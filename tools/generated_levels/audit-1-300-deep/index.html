    const h = grid.length, w = grid[0].length;
    canvas.width = w * cellSize;
    canvas.height = h * cellSize;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingEnabled = false;

    for (let r = 0; r < h; r++) {
        for (let c = 0; c < w; c++) {
            const v = grid[r][c];
            if (v === 0) continue;
            const hex = options.palette?.[v] || COLOR_HEX[v] || '#ccc';
            const x = c * cellSize, y = r * cellSize;
            const radius = Math.max(0.5, cellSize * 0.14);

            // Fill the full cell so preview scaling does not create white seams.
            ctx.beginPath();
            ctx.roundRect(x, y, cellSize + 0.35, cellSize + 0.35, radius);
            ctx.fillStyle = hex;
            ctx.fill();

            // Subtle highlight
            if (cellSize >= 7) {
                ctx.beginPath();
                ctx.roundRect(x + cellSize * 0.18, y + cellSize * 0.16, cellSize * 0.64, cellSize * 0.24, radius);
                ctx.fillStyle = 'rgba(255,255,255,0.10)';
                ctx.fill();
            }
        }
    }

    if (options.specialMeta) {
        drawSpecialOverlays(ctx, options.specialMeta, w, h, cellSize, options.specialMode || 'card');
    }
}
